<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Luck Loop – Missioni quotidiane per aumentare le tue opportunità reali." />
  <title>Luck Loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-900: #0D1117;
      --navy-800: #161B24;
      --navy-700: #1C2333;
      --navy-600: #253047;
      --gold:     #C9A84C;
      --gold-lt:  #DFC57A;
      --cream:    #E8DCC8;
      --cream-dim:#B8A98A;
      --teal:     #4ECDC4;
      --amber:    #E8934A;
      --violet:   #9C6FDE;
      --star:     #F5C842;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--navy-900); color: var(--cream); font-family: 'Inter', system-ui, sans-serif; min-height: 100dvh; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--navy-600); border-radius: 99px; }

    .app { max-width: 520px; margin: 0 auto; padding: 0 16px 80px; position: relative; }
    .glow-top { position: fixed; top: -120px; right: -120px; width: 360px; height: 360px; background: radial-gradient(circle, rgba(201,168,76,.07) 0%, transparent 70%); pointer-events: none; }
    .glow-bottom { position: fixed; bottom: -120px; left: -120px; width: 360px; height: 360px; background: radial-gradient(circle, rgba(78,205,196,.07) 0%, transparent 70%); pointer-events: none; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 8px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(201,168,76,.15); border: 1px solid rgba(201,168,76,.3); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--gold); }
    .logo-name { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--cream); letter-spacing: .03em; }

    nav { display: flex; gap: 4px; }
    nav button { background: none; border: none; cursor: pointer; color: var(--cream-dim); font-size: 13px; font-family: inherit; padding: 6px 10px; border-radius: 8px; transition: background .15s, color .15s; }
    nav button:hover { color: var(--cream); background: rgba(255,255,255,.07); }
    nav button.active { background: rgba(255,255,255,.1); color: var(--cream); }

    .page-title { font-family: 'Playfair Display', serif; font-size: 28px; line-height: 1.2; }
    .page-date { font-size: 13px; color: var(--cream-dim); margin-bottom: 4px; }

    .card { border-radius: 16px; padding: 20px; margin-bottom: 14px; }
    .card-teal  { background: var(--navy-700); border: 1px solid rgba(78,205,196,.25);  box-shadow: 0 0 28px rgba(78,205,196,.05); }
    .card-amber { background: var(--navy-700); border: 1px solid rgba(232,147,74,.25);  box-shadow: 0 0 28px rgba(232,147,74,.05); }
    .card-glass { background: var(--navy-700); border: 1px solid rgba(255,255,255,.08); }
    .card-dark    { background: var(--navy-800); border-radius: 12px; padding: 16px; }
    /* Missione speciale — bordo viola sottile, nessun altro cambiamento visivo */
    .card-special { background: var(--navy-700); border: 1px solid rgba(156,111,222,.35); box-shadow: 0 0 28px rgba(156,111,222,.06); }

    .tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; }
    .tag-real  { color: var(--teal);  background: rgba(78,205,196,.1);  border: 1px solid rgba(78,205,196,.2);  }
    .tag-micro   { color: var(--amber);  background: rgba(232,147,74,.1);  border: 1px solid rgba(232,147,74,.2);  }
    .tag-special { color: var(--violet); background: rgba(156,111,222,.1); border: 1px solid rgba(156,111,222,.25); }

    .btn { display: inline-flex; align-items: center; justify-content: center; font-family: inherit; font-weight: 600; cursor: pointer; border-radius: 12px; border: none; padding: 12px 20px; font-size: 14px; transition: transform .12s, opacity .15s, background .15s; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--gold); color: var(--navy-900); }
    .btn-primary:hover { background: var(--gold-lt); }
    .btn-teal  { background: rgba(78,205,196,.1);  color: var(--teal);  border: 1px solid rgba(78,205,196,.3);  }
    .btn-teal:hover  { background: rgba(78,205,196,.18);  }
    .btn-amber { background: rgba(232,147,74,.1);  color: var(--amber); border: 1px solid rgba(232,147,74,.3);  }
    .btn-amber:hover   { background: rgba(232,147,74,.18); }
    .btn-special { background: rgba(156,111,222,.1); color: var(--violet); border: 1px solid rgba(156,111,222,.3); }
    .btn-special:hover { background: rgba(156,111,222,.18); }
    .btn-ghost { background: transparent; color: var(--cream-dim); border: 1px solid rgba(255,255,255,.15); }
    .btn-ghost:hover { border-color: rgba(255,255,255,.35); color: var(--cream); }
    .btn-danger { background: transparent; color: rgba(239,68,68,.6); border: 1px solid rgba(239,68,68,.25); font-size: 13px; padding: 8px 14px; }
    .btn-danger:hover { border-color: rgba(239,68,68,.5); color: rgba(239,68,68,.9); }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .impact { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 8px; }
    .impact-basso { color: var(--cream-dim); background: rgba(184,169,138,.1); }
    .impact-medio { color: var(--gold);  background: rgba(201,168,76,.1); }
    .impact-alto  { color: var(--teal);  background: rgba(78,205,196,.1); }

    .streak-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--navy-700); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; margin-bottom: 18px; }
    .streak-item { display: flex; align-items: center; gap: 8px; }
    .streak-num { font-family: 'Playfair Display', serif; font-size: 22px; line-height: 1; }
    .streak-label { font-size: 11px; color: var(--cream-dim); }
    .streak-divider { width: 1px; height: 32px; background: rgba(255,255,255,.08); }

    .energy-option { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: var(--navy-700); cursor: pointer; font-family: inherit; transition: border-color .15s, background .15s; margin-bottom: 10px; }
    .energy-option:hover { border-color: rgba(255,255,255,.25); }
    .energy-option.selected { border-color: var(--gold); background: rgba(201,168,76,.08); }
    .energy-name { font-size: 15px; font-weight: 600; color: var(--cream); }
    .energy-desc { font-size: 12px; color: var(--cream-dim); }
    .energy-check { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); display: none; align-items: center; justify-content: center; }
    .energy-option.selected .energy-check { display: flex; }

    .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 20px; margin: 10px 0 8px; line-height: 1.25; }
    .card-desc { font-size: 13px; color: var(--cream-dim); line-height: 1.6; margin-bottom: 14px; }
    .card-why { border-top: 1px solid rgba(255,255,255,.08); padding-top: 12px; margin-bottom: 16px; }
    .card-why p { font-size: 12px; color: var(--cream-dim); line-height: 1.6; }
    .card-why strong { color: var(--teal); }

    /* ── MICRO-PRINCIPIO ── */
    .mp-principio {
      background: rgba(232,147,74,.06);
      border: 1px solid rgba(232,147,74,.15);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .mp-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--amber); margin-bottom: 4px; }
    .mp-testo { font-size: 13px; color: var(--cream); line-height: 1.55; }
    .mp-fonte { font-size: 11px; color: var(--cream-dim); margin-top: 4px; font-style: italic; }

    .mp-cultura {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .mp-cultura .mp-label { color: var(--cream-dim); }

    .mp-azione {
      background: rgba(201,168,76,.07);
      border: 1px solid rgba(201,168,76,.2);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .mp-azione .mp-label { color: var(--gold); }
    .mp-azione .mp-testo { font-weight: 500; }

    .mp-completed {
      display: flex; align-items: center; gap: 10px;
      background: rgba(232,147,74,.08); border: 1px solid rgba(232,147,74,.2);
      border-radius: 12px; padding: 11px 14px;
    }
    .mp-completed-check { width: 28px; height: 28px; border-radius: 50%; background: var(--amber); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .mp-completed strong { font-size: 13px; color: var(--amber); display: block; }
    .mp-completed span { font-size: 11px; color: var(--cream-dim); }

    /* ── CARD REALE ── */
    .completed-state { display: flex; align-items: center; gap: 12px; background: rgba(78,205,196,.08); border: 1px solid rgba(78,205,196,.2); border-radius: 12px; padding: 12px; }
    .completed-check { width: 32px; height: 32px; border-radius: 50%; background: var(--teal); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .completed-text strong { font-size: 13px; color: var(--teal); }
    .completed-text span { font-size: 11px; color: var(--cream-dim); display: block; }
    .confirm-row { display: flex; gap: 8px; }
    .confirm-label { font-size: 12px; color: var(--cream-dim); text-align: center; margin-bottom: 8px; }

    .done-banner { text-align: center; padding: 24px 0 8px; }
    .done-emoji { font-size: 36px; margin-bottom: 8px; }
    .done-title { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 4px; }
    .done-sub { font-size: 13px; color: var(--cream-dim); }
    .streak-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(201,168,76,.1); border: 1px solid rgba(201,168,76,.2); border-radius: 99px; padding: 6px 16px; font-size: 13px; font-weight: 600; color: var(--gold); margin-top: 12px; }


    /* ── SFIDA DEL GIORNO ────────────────────────── */
    .card-star   { background:var(--navy-700); border:1px solid rgba(245,200,66,.28); box-shadow:0 0 28px rgba(245,200,66,.05); }
    .tag-star    { color:#F5C842; background:rgba(245,200,66,.1); border:1px solid rgba(245,200,66,.22); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:99px; display:inline-block; }
    .btn-star    { background:rgba(245,200,66,.1); color:#F5C842; border:1px solid rgba(245,200,66,.3); }
    .btn-star:hover { background:rgba(245,200,66,.18); }
    .sfida-box   { background:var(--navy-800); border-radius:12px; padding:20px; margin-bottom:16px; display:flex; flex-direction:column; align-items:center; gap:14px; min-height:140px; justify-content:center; }
    .forme-grid  { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
    .forma       { width:44px; height:44px; border-radius:50%; cursor:pointer; transition:transform .15s; display:flex; align-items:center; justify-content:center; border:none; }
    .forma:active { transform:scale(.9); }
    @keyframes correctFlash { 0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)} }
    @keyframes wrongShake   { 0%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}100%{transform:translateX(0)} }
    .focus-ring  { position:relative; width:120px; height:120px; touch-action:none; cursor:pointer; }
    .focus-svg   { width:120px; height:120px; transform:rotate(-90deg); }
    .focus-track { fill:none; stroke:rgba(255,255,255,.08); stroke-width:9; }
    .focus-prog  { fill:none; stroke:#F5C842; stroke-width:9; stroke-linecap:round; stroke-dasharray:339.3; stroke-dashoffset:339.3; transition:stroke-dashoffset .08s linear; }
    .focus-label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-size:26px; }
    .mistero-btn { width:72px; height:72px; border-radius:50%; background:rgba(245,200,66,.1); border:2px solid rgba(245,200,66,.35); font-size:30px; cursor:pointer; transition:transform .15s,background .15s; display:flex; align-items:center; justify-content:center; }
    .mistero-btn:hover { background:rgba(245,200,66,.2); transform:scale(1.06); }
    .mistero-reveal { font-size:14px; color:var(--cream); line-height:1.6; text-align:center; max-width:240px; animation:fadeUp .35s ease-out; }
    .scena-wrap  { position:relative; width:100%; max-width:280px; }
    .sfida-done  { display:flex; align-items:center; gap:10px; background:rgba(245,200,66,.08); border:1px solid rgba(245,200,66,.22); border-radius:12px; padding:12px 14px; }
    .sfida-done-icon { width:28px; height:28px; border-radius:50%; background:#F5C842; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .sfida-done strong { font-size:13px; color:#F5C842; display:block; }
    .sfida-done span   { font-size:11px; color:var(--cream-dim); }
    @keyframes starPop { 0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.25) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1} }
    .star-pop { animation:starPop .55s cubic-bezier(.34,1.56,.64,1) both; }
    .star-num  { font-family:'Playfair Display',serif; font-size:22px; line-height:1; color:#F5C842; }

    /* ── COME FUNZIONA ── */
    .how-section { margin-bottom: 14px; }
    .how-list li { display: flex; gap: 8px; font-size: 13px; color: var(--cream-dim); margin-bottom: 6px; line-height: 1.5; list-style: none; }
    .how-list li::before { content: '→'; color: var(--teal); flex-shrink: 0; }
    .no-list li { display: flex; gap: 8px; font-size: 13px; color: var(--cream-dim); margin-bottom: 6px; list-style: none; }
    .no-list li::before { content: '✕'; color: #f87171; flex-shrink: 0; }

    /* ── ARCHIVIO ── */
    .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
    .stat-box { background: var(--navy-700); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 12px; text-align: center; }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 24px; }
    .stat-label { font-size: 11px; color: var(--cream-dim); }
    .badge-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; margin-bottom: 6px; }
    .badge-row.earned { background: rgba(201,168,76,.08); border: 1px solid rgba(201,168,76,.18); }
    .badge-row.locked { opacity: .38; }
    .badge-emoji { font-size: 22px; }
    .badge-name { font-size: 13px; font-weight: 600; color: var(--gold); }
    .badge-desc { font-size: 11px; color: var(--cream-dim); }
    .history-item { display: flex; align-items: center; gap: 10px; background: var(--navy-800); border-radius: 10px; padding: 10px; margin-bottom: 6px; }
    .history-icon { font-size: 18px; }
    .history-title { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { font-size: 11px; color: var(--cream-dim); }
    .history-check { width: 20px; height: 20px; border-radius: 50%; background: rgba(78,205,196,.2); flex-shrink: 0; margin-left: auto; display: flex; align-items: center; justify-content: center; }

    /* ── DEBUG ── */
    .debug-toggle { background: none; border: none; color: rgba(255,255,255,.2); font-size: 12px; font-family: inherit; cursor: pointer; margin-top: 24px; }
    .debug-toggle:hover { color: rgba(255,255,255,.4); }
    .debug-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    /* ── TOAST ── */
    #badge-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--navy-700); border: 1px solid rgba(201,168,76,.35); border-radius: 18px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; min-width: 260px; z-index: 100; box-shadow: 0 16px 48px rgba(0,0,0,.5); transition: transform .4s cubic-bezier(.34,1.56,.64,1), opacity .4s; opacity: 0; pointer-events: none; }
    #badge-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast-label { font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
    .toast-title { font-family: 'Playfair Display', serif; font-size: 18px; line-height: 1.1; }
    .toast-desc { font-size: 11px; color: var(--cream-dim); }

    /* ── MISC ── */
    .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--cream-dim); font-family: inherit; font-size: 13px; cursor: pointer; margin-bottom: 20px; padding: 0; transition: color .15s; }
    .back-btn:hover { color: var(--cream); }
    .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--cream-dim); margin-bottom: 12px; }
    h2.section-title { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 16px; }
    h3.card-sub { font-family: 'Playfair Display', serif; font-size: 17px; margin-bottom: 8px; }

    .page    { animation: fadeUp .4s ease-out both; }
    .flip-in { animation: flipIn .5s ease-out both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes flipIn { from { opacity:0; transform:rotateY(-70deg); } to { opacity:1; transform:rotateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>

<div class="glow-top"></div>
<div class="glow-bottom"></div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">∞</div>
      <span class="logo-name">Luck Loop</span>
    </div>
    <nav>
      <button id="nav-history" onclick="showPage('history')">Archivio</button>
      <button id="nav-how" onclick="showPage('how')">Come funziona</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<div id="badge-toast">
  <span id="toast-emoji" style="font-size:32px"></span>
  <div>
    <div class="toast-label">Nuovo badge!</div>
    <div class="toast-title" id="toast-title"></div>
    <div class="toast-desc" id="toast-desc"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   DATI — MISSIONI REALI
══════════════════════════════════════════════════ */
const MISSIONI_REALI = [
  { id:'r01', categoria:'sociale',     energia:['bassa','media','alta'], titolo:"Scrivi a qualcuno che non senti da un po'", descrizione:"Manda un messaggio breve e sincero a una persona che stimi. Non chiedere nulla, solo un contatto genuino.", impatto:'medio', perche:"Le reti sociali dormienti sono una delle fonti più sottovalutate di opportunità inaspettate." },
  { id:'r02', categoria:'sociale',     energia:['media','alta'],         titolo:"Parla con uno sconosciuto",                  descrizione:"Fai una domanda o un complimento sincero a qualcuno che non conosci. Bar, negozio, coda: qualunque contesto.", impatto:'alto',  perche:"Le connessioni deboli (weak ties) aprono porte che le amicizie strette raramente raggiungono." },
  { id:'r03', categoria:'sociale',     energia:['bassa'],                titolo:"Rispondi al messaggio rimasto in sospeso",    descrizione:"C'è qualcuno che aspetta una tua risposta. Fallo ora, anche con due righe.", impatto:'basso', perche:"L'affidabilità nelle piccole cose costruisce reputazione nel tempo." },
  { id:'r04', categoria:'sociale',     energia:['media','alta'],         titolo:"Partecipa a un evento",                      descrizione:"Trova un evento, meetup o incontro nel tuo settore o area di interesse. Basta essere presenti.", impatto:'alto',  perche:"La presenza fisica o attiva aumenta la probabilità di essere ricordati e coinvolti." },
  { id:'r05', categoria:'sociale',     energia:['bassa','media'],        titolo:"Fai una micro-presentazione",                descrizione:"Pensa a due persone che potrebbero trarre vantaggio dal conoscersi. Presentale via messaggio.", impatto:'alto',  perche:"Chi connette gli altri viene percepito come risorsa preziosa e ricordato con gratitudine." },
  { id:'r06', categoria:'esplorazione',energia:['bassa','media','alta'], titolo:"Cambia percorso",                            descrizione:"Oggi prendi una strada diversa dal solito. Anche solo 10 minuti a piedi in una direzione nuova.", impatto:'basso', perche:"Piccoli cambiamenti di routine espongono il cervello a stimoli nuovi e aumentano la prontezza cognitiva." },

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=Math.imul(31,h)+s.charCodeAt(i)|0;return Math.abs(h);}
function mkRng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};}
function rngVal(data,sale){const r=mkRng(hash(data+sale));r();return r();}

/* ══════════════════════════════════════════════════
   MEMORIA UTENTE — ll_m (cuore del sistema reattivo)
   Struttura:
   {
     completate: [{id, categoria, energia, data, speciale}],  // max 100
     ignorate:   [{id, categoria, energia, data}],            // max 100
     categorie:  {sociale:1, esplorazione:1, abitudini:1},    // pesi dinamici
     energiaIgnorata: {bassa:0, media:0, alta:0},             // conta energia ignorata
     socialeSenza: 0,   // giorni senza missione sociale completata
     altaIgnorataDa: 0, // giorni consecutivi con "alta" ignorata
   }
══════════════════════════════════════════════════ */
const KK = {
  G:'ll_g', H:'ll_h', S:'ll_s', B:'ll_b', T:'ll_t',
  M:'ll_m',            // [v1.3] memoria utente unificata
  MR:'ll_mr_hist',     // storico missioni mostrate (anti-ripetizione)
  MP:'ll_mp_hist',     // storico micro-principi mostrati
};
const sg = k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}};
const ss = (k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

function oggi(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function ieriDi(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()-1);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

// Memoria utente — default
function memDefault(){
  return{
    completate:[],ignorate:[],
    categorie:{sociale:1,esplorazione:1,abitudini:1},
    energiaIgnorata:{bassa:0,media:0,alta:0},
    socialeSenza:0,
    altaIgnorataDa:0,
  };
}
function getMem(){return {...memDefault(),...(sg(KK.M)||{})};}
function saveMem(m){ss(KK.M,m);}

// Streak e totale (invariati)
const storia         =()=>sg(KK.H)||[];
const streak         =()=>sg(KK.S)||{corrente:0,record:0,ultimaData:null};
const totale         =()=>parseInt(localStorage.getItem(KK.T)||'0',10);
const badgeGuadagnati=()=>sg(KK.B)||[];

function aggiungiStoria(e){const h=storia();h.unshift({...e,completatoIl:new Date().toISOString()});ss(KK.H,h.slice(0,100));}
function aggiornaStreak(data){const s=streak();if(s.ultimaData===data)return s;s.corrente=s.ultimaData===ieriDi(data)?s.corrente+1:1;s.record=Math.max(s.record,s.corrente);s.ultimaData=data;ss(KK.S,s);return s;}
function incTotale(){const n=totale()+1;localStorage.setItem(KK.T,n);return n;}
function daBadge(id){const b=badgeGuadagnati();if(b.includes(id))return false;b.push(id);ss(KK.B,b);return true;}
function resetTutto(){Object.values(KK).forEach(k=>localStorage.removeItem(k));}

/* ══════════════════════════════════════════════════
   REGISTRAZIONE EVENTI — aggiorna la memoria utente
══════════════════════════════════════════════════ */
function registraCompletamento(missione){
  const m=getMem();
  // Aggiungi a completate
  m.completate.unshift({id:missione.id,categoria:missione.categoria,data:oggi(),speciale:!!missione.speciale});
  m.completate=m.completate.slice(0,100);

  // Peso categoria: +0.2, clamp 0.5–2.0
  if(m.categorie[missione.categoria]!==undefined){
    m.categorie[missione.categoria]=Math.min(2.0, m.categorie[missione.categoria]+0.2);
  }

  // Reset contatori sociali se missione sociale completata
  if(missione.categoria==='sociale') m.socialeSenza=0;

  // Reset altaIgnorataDa se energia alta completata
  saveMem(m);
}

function registraIgnorata(missione, energia){
  if(!missione) return;
  const m=getMem();
  // Aggiungi a ignorate
  m.ignorate.unshift({id:missione.id,categoria:missione.categoria,energia,data:oggi()});
  m.ignorate=m.ignorate.slice(0,100);

  // Peso categoria: -0.3, clamp 0.5–2.0
  if(!missione.speciale && m.categorie[missione.categoria]!==undefined){
    m.categorie[missione.categoria]=Math.max(0.5, m.categorie[missione.categoria]-0.3);
  }

  // Conta energia ignorata
  if(m.energiaIgnorata[energia]!==undefined) m.energiaIgnorata[energia]++;

  // Conta giorni senza sociale
  if(missione.categoria!=='sociale') m.socialeSenza=(m.socialeSenza||0)+1;

  // Conta giorni con alta ignorata
  if(energia==='alta') m.altaIgnorataDa=(m.altaIgnorataDa||0)+1;
  else m.altaIgnorataDa=0;

  saveMem(m);
}

/* ══════════════════════════════════════════════════
   ANTI-RIPETIZIONE — basata su esperienza, non su data
   Esclude missioni completate negli ultimi 30 giorni.
   Se pool < 3, include le meno recenti (fallback).
══════════════════════════════════════════════════ */
const FINESTRA = 30;

function dataRecentiSet(n){
  const s=new Set();
  for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);s.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);}
  return s;
}

function idCompletateRecenti(){
  const rec=dataRecentiSet(FINESTRA);
  const mem=getMem();
  return new Set(mem.completate.filter(e=>rec.has(e.data)).map(e=>e.id));
}

function idxMicroRecenti(){
  const rec=dataRecentiSet(FINESTRA);
  return new Set((sg(KK.MP)||[]).filter(e=>rec.has(e.data)).map(e=>e.idx));
}

function addMissioneHist(id,data){const h=sg(KK.MR)||[];h.push({id,data});ss(KK.MR,h.slice(-60));}
function addMicroHist(idx,data){const h=sg(KK.MP)||[];h.push({idx,data});ss(KK.MP,h.slice(-60));}

/* ══════════════════════════════════════════════════
   PESO DINAMICO — cuore del sistema reattivo
   peso = base(categoria) + bonus streak + malus inattività
══════════════════════════════════════════════════ */
function calcolaPesi(pool, mem, streakCorrente){
  // Bonus streak alta: favorisce sociale/esplorazione
  const bonusStreak = streakCorrente >= 5 ? 0.3 : 0;

  return pool.map(m=>{
    let peso = mem.categorie[m.categoria] || 1.0;

    // Bonus streak per categorie che ampliano le opportunità
    if(streakCorrente>=5 && (m.categoria==='sociale'||m.categoria==='esplorazione')){
      peso += bonusStreak;
    }

    // Malus se energia alta è stata ignorata spesso
    // (non eliminare, solo ridurre la probabilità di missioni impegnative)
    const altaIgn = mem.altaIgnorataDa||0;
    if(altaIgn>=3 && m.impatto==='alto'){
      peso = Math.max(0.3, peso-0.4);
    }

    // Bonus abitudini se utente inattivo (socialeSenza alto)
    if((mem.socialeSenza||0)>=5 && m.categoria==='abitudini'){
      peso += 0.3;
    }

    return {missione:m, peso:Math.max(0.3, Math.min(2.0, peso))};
  });
}

/* ══════════════════════════════════════════════════
   SELEZIONE MISSIONE REALE (reattiva)
══════════════════════════════════════════════════ */
function scegliMissioneReale(data, energia, mem, streakCorrente){
  // 1. Pool base filtrato per energia
  let pool = MISSIONI_REALI.filter(m=>m.energia.includes(energia));
  if(!pool.length) pool=[...MISSIONI_REALI];

  // 2. Anti-ripetizione: rimuovi completate negli ultimi 30gg
  const viste = idCompletateRecenti();
  let disp = pool.filter(m=>!viste.has(m.id));

  // 3. Fallback se pool troppo piccolo
  if(disp.length<3){
    const hist=sg(KK.MR)||[];
    const ultime={};hist.forEach(e=>{ultime[e.id]=e.data;});
    const fallback=pool.filter(m=>viste.has(m.id))
      .sort((a,b)=>(ultime[a.id]||'0')<(ultime[b.id]||'0')?-1:1)
      .slice(0,3-disp.length);
    disp=[...disp,...fallback];
  }

  // 4. Calcola pesi dinamici
  const pesati = calcolaPesi(disp, mem, streakCorrente);

  // 5. Costruisci lottery pesata
  const lottery=[];
  pesati.forEach(({missione,peso})=>{
    const slots=Math.max(1,Math.round(peso*10));
    for(let i=0;i<slots;i++) lottery.push(missione);
  });

  // 6. Selezione deterministica per data+energia (riproducibile)
  const r=mkRng(hash(data+'miss2'+energia));r();
  return lottery[Math.min(Math.floor(r()*lottery.length),lottery.length-1)]||disp[0]||pool[0];
}

/* ══════════════════════════════════════════════════
   SELEZIONE MICRO-PRINCIPIO (reattiva)
   Orienta il principio verso il comportamento prevalente:
   - Completa spesso sociale → principi su relazioni
   - Evita sociale → principi su psicologia individuale
   - Completa abitudini → principi su routine
══════════════════════════════════════════════════ */
function scegliMicro(data, mem){
  const visti=idxMicroRecenti();
  let cand=MICRO_PRINCIPI.map((_,i)=>i).filter(i=>!visti.has(i));
  if(cand.length<3){
    const hist=sg(KK.MP)||[];
    const ultime={};hist.forEach(e=>{ultime[e.idx]=e.data;});
    const fallback=MICRO_PRINCIPI.map((_,i)=>i).filter(i=>visti.has(i))
      .sort((a,b)=>(ultime[a]||'0')<(ultime[b]||'0')?-1:1).slice(0,3-cand.length);
    cand=[...cand,...fallback];
  }

  // Determina orientamento prevalente dall'utente
  const catPrev = Object.entries(mem.categorie)
    .sort((a,b)=>b[1]-a[1])[0][0]; // categoria con peso maggiore

  // Mappa categoria → tema micro-principio
  const temaFav = catPrev==='sociale' ? 'relazioni'
                : catPrev==='abitudini' ? 'abitudini'
                : 'individuale';

  // Costruisci lista pesata: principi del tema favorito hanno peso 2x
  const pesati=[];
  cand.forEach(idx=>{
    const tag=tagDiMicro(idx);
    const slots=tag===temaFav?2:1;
    for(let i=0;i<slots;i++) pesati.push(idx);
  });

  const r=mkRng(hash(data+'mp3'));r();
  const pick=pesati[Math.min(Math.floor(r()*pesati.length),pesati.length-1)];
  return{idx:pick, dato:MICRO_PRINCIPI[pick]||MICRO_PRINCIPI[0]};
}

/* ══════════════════════════════════════════════════
   EVENTI ADATTIVI — non random puro, ma condizionati
   al comportamento recente dell'utente
══════════════════════════════════════════════════ */
function controllaEventoSpeciale(data, mem, streakCorrente){
  const altaIgn  = mem.altaIgnorataDa||0;
  const senzaSoc = mem.socialeSenza||0;
  const baseProb = rngVal(data,'special3');

  // Trigger 1: "Sfida Coraggio" — solo se alta energia ignorata da 3+ giorni
  if(altaIgn>=3 && baseProb<0.12){
    return MISSIONI_SPECIALI[1]; // Sfida Coraggio
  }

  // Trigger 2: "Connessione Umana" — se nessun sociale completato da 5+ giorni
  if(senzaSoc>=5 && baseProb<0.15){
    return MISSIONI_SPECIALI[2]; // Connessione Umana
  }

  // Trigger 3: "Reset Loop" — streak lunga (10+) con bassa varietà categorie
  if(streakCorrente>=10){
    const pesi=Object.values(mem.categorie);
    const maxPeso=Math.max(...pesi);
    const minPeso=Math.min(...pesi);
    // Bassa varietà = una categoria domina molto
    if(maxPeso-minPeso>1.0 && baseProb<0.08){
      return {...MISSIONI_SPECIALI[0], titolo:"Reset Loop — esci dal pattern", tipoSpeciale:"Reset"};
    }
  }

  // Evento raro generico (~3%)
  if(baseProb<0.03){
    const r=mkRng(hash(data+'sp4'));r();
    return MISSIONI_SPECIALI[Math.min(Math.floor(r()*MISSIONI_SPECIALI.length),MISSIONI_SPECIALI.length-1)];
  }

  return null;
}

/* ══════════════════════════════════════════════════
   COSTRUZIONE GIORNATA (reattiva)
══════════════════════════════════════════════════ */
function costruisciGiornata(data, energia){
  const mem = getMem();
  const str = streak();

  const mSpec  = controllaEventoSpeciale(data, mem, str.corrente);
  const mReale = mSpec || scegliMissioneReale(data, energia, mem, str.corrente);
  const {idx:mpIdx, dato:mpDato} = scegliMicro(data, mem);

  return{
    data, energia,
    missioneReale:   mReale,
    missioneSpeciale:!!mSpec,
    microPrincipio:  mpDato,
    microIdx:        mpIdx,
    realeCompletata: false,
    microCompletato: false,
    _mId:  mReale.id,
    _mpIdx:mpIdx,
  };
}

/* ══════════════════════════════════════════════════
   MIGRAZIONE AUTOMATICA da v1.0 / v1.1 / v1.2
══════════════════════════════════════════════════ */
function migra(s){
  if(!s) return s;
  if(!s.microPrincipio){const{idx,dato}=scegliMicro(s.data||oggi(),getMem());s.microPrincipio=dato;s.microIdx=idx;s.microCompletato=false;}
  if(s.missioneSpeciale===undefined) s.missioneSpeciale=false;
  if(!s._mId)  s._mId=s.missioneReale?.id||'';
  if(s._mpIdx===undefined) s._mpIdx=s.microIdx||0;
  return s;
}

    {id:'cinquanta',     ok:app.totale>=50},

function renderCardReale(m,completata,speciale){

/* ══════════════════════════════════════════════════
   SFIDA DEL GIORNO — dati e logica
══════════════════════════════════════════════════ */

// Tipi di sfida disponibili
const TIPI_SFIDA = ['rompi-loop','micro-coraggio','dettaglio','focus30'];

// Micro-azioni per "Micro Coraggio" (scelta random al click)
const MICRO_AZIONI = [
  "Scrivi una cosa che rimandi da giorni.",
  "Pensa a una persona che non senti da tempo. Cosa le diresti?",
  "Fai tre respiri profondi, lentamente.",
  "Sorridi per 10 secondi. Anche da solo.",
  "Scrivi la prima cosa bella che ti viene in mente oggi.",
  "Nota qualcosa nell'ambiente che non avevi mai osservato prima.",
  "Pensa a una piccola cosa per cui sei grato oggi.",
  "Chiudi gli occhi per 20 secondi. Poi riapri.",
  "Scrivi il nome di qualcuno a cui vorresti dire grazie.",
  "Immagina come sarà il tuo io di fra 5 anni a guardare oggi.",
];

// Messaggi finali per ogni tipo
const MSG_FINE = {
  'rompi-loop':    "Hai individuato l'anomalia. Le opportunità spesso assomigliano a questo.",
  'micro-coraggio':"Molte opportunità iniziano da un passo senza garanzie.",
  'dettaglio':     "Ciò che cambia è spesso ciò che conta.",
  'focus30':       "La concentrazione è una forma di forza.",
};

/* ── Storage punti fortuna ───────────────────────── */
const KS = {
  PF:  'll_pf',     // totale punti fortuna
  SD:  'll_sd',     // stato sfida giornaliera {data, tipo, completata}
  PFB: 'll_pfb',    // badge punti fortuna già assegnati
};

function getPF()   { return parseInt(localStorage.getItem(KS.PF)||'0',10); }
function addPF()   { const n=getPF()+1; localStorage.setItem(KS.PF,n); return n; }
function getSfidaStato() { try{return JSON.parse(localStorage.getItem(KS.SD));}catch{return null;} }
function saveSfidaStato(v){ try{localStorage.setItem(KS.SD,JSON.stringify(v));}catch{} }
function getPFBadge() { try{return JSON.parse(localStorage.getItem(KS.PFB))||[];}catch{return[];} }
function addPFBadge(id){ const b=getPFBadge(); if(b.includes(id))return false; b.push(id); try{localStorage.setItem(KS.PFB,JSON.stringify(b));}catch{} return true; }

const BADGE_PF = [
  {id:'pf_10',  label:'Esploratore',          desc:'10 Punti Fortuna',           emoji:'🔍', soglia:10},
  {id:'pf_30',  label:'Cercatore',             desc:'30 Punti Fortuna',           emoji:'🧭', soglia:30},
  {id:'pf_100', label:'Costruttore di Occasioni',desc:'100 Punti Fortuna',       emoji:'⭐', soglia:100},
];

/* ── Selezione tipo sfida (deterministica per data) ── */
function scegliTipoSfida(data){
  const r = mkRng(hash(data+'sfida'));r();
  return TIPI_SFIDA[Math.floor(r()*TIPI_SFIDA.length)];
}

/* ── Stato runtime sfida (non salvato tra render) ─── */
let sfidaRuntime = {
  tipo: null,
  fase: 'idle',       // idle | gioco | vinto | perso
  // rompi-loop
  forme: [],
  idxDiversa: -1,
  // dettaglio
  scenaCambiata: false,
  idxCambiamento: -1,
  // focus30
  timerFocus: null,
  progressoFocus: 0,
  holdAttivo: false,
  // micro-coraggio
  azioneRivelata: null,
};

function inizializzaSfida(tipo){
  sfidaRuntime = {tipo, fase:'gioco', forme:[], idxDiversa:-1, scenaCambiata:false, idxCambiamento:-1, timerFocus:null, progressoFocus:0, holdAttivo:false, azioneRivelata:null};
  if(tipo==='rompi-loop')   inizRompiLoop();
  if(tipo==='dettaglio')    inizDettaglio();
}

/* ── ROMPI IL LOOP ──────────────────────────────── */
function inizRompiLoop(){
  const n = 9;
  const colori = ['#4ECDC4','#C9A84C','#9C6FDE'];
  const c = colori[Math.floor(Math.random()*colori.length)];
  sfidaRuntime.idxDiversa = Math.floor(Math.random()*n);
  sfidaRuntime.forme = Array.from({length:n},(_,i)=>({
    id:i,
    colore: i===sfidaRuntime.idxDiversa ? '#E8934A' : c,
    shape:  i===sfidaRuntime.idxDiversa ? 'quadrato' : 'cerchio',
  }));
}

window.toccaForma = function(idx){
  if(sfidaRuntime.fase!=='gioco') return;
  if(idx===sfidaRuntime.idxDiversa){
    sfidaRuntime.fase='vinto';
    completaSfida();
  } else {
    // Feedback visivo sbagliato — reimposta dopo breve delay
    const el=document.getElementById('forma-'+idx);
    if(el){el.style.animation='wrongShake .3s ease-out';setTimeout(()=>{if(el)el.style.animation='';},350);}
  }
  renderSfidaBox();
};

/* ── MICRO CORAGGIO ─────────────────────────────── */
window.premiMistero = function(){
  if(sfidaRuntime.fase!=='gioco') return;
  const idx=Math.floor(Math.random()*MICRO_AZIONI.length);
  sfidaRuntime.azioneRivelata=MICRO_AZIONI[idx];
  sfidaRuntime.fase='vinto';
  completaSfida();
  renderSfidaBox();
};

/* ── DETTAGLIO NUOVO ────────────────────────────── */
// Scena: 4 oggetti SVG semplici, uno cambia colore/forma dopo 1.2s
const OGGETTI_SCENA = [
  {x:50,  y:50,  tipo:'cerchio', r:18},
  {x:140, y:60,  tipo:'rett',    w:32, h:22},
  {x:220, y:45,  tipo:'cerchio', r:14},
  {x:95,  y:110, tipo:'rett',    w:24, h:36},
  {x:180, y:105, tipo:'cerchio', r:20},
  {x:245, y:110, tipo:'rett',    w:28, h:18},
];
const COLORI_SCENA = ['#4ECDC4','#C9A84C','#9C6FDE','#E8934A','#4CAF76'];

function inizDettaglio(){
  sfidaRuntime.idxCambiamento = Math.floor(Math.random()*OGGETTI_SCENA.length);
  sfidaRuntime.scenaCambiata  = false;
  // Mostra scena originale 1.2s, poi cambia
  setTimeout(()=>{
    sfidaRuntime.scenaCambiata=true;
    renderSfidaBox();
  }, 1200);
}

window.toccaOggetto = function(idx){
  if(sfidaRuntime.fase!=='gioco' || !sfidaRuntime.scenaCambiata) return;
  if(idx===sfidaRuntime.idxCambiamento){
    sfidaRuntime.fase='vinto';
    completaSfida();
  } else {
    const el=document.getElementById('ogg-'+idx);
    if(el){el.style.animation='wrongShake .3s ease-out';setTimeout(()=>{if(el)el.style.animation='';},350);}
  }
  renderSfidaBox();
};

/* ── FOCUS 30 ───────────────────────────────────── */
const DURATA_FOCUS = 30;

window.startFocus = function(){
  if(sfidaRuntime.fase!=='gioco') return;
  sfidaRuntime.holdAttivo=true;
  const step=100; // ms
  sfidaRuntime.timerFocus = setInterval(()=>{
    if(!sfidaRuntime.holdAttivo){
      sfidaRuntime.progressoFocus=0;
      aggiornaCerchio(0);
      return;
    }
    sfidaRuntime.progressoFocus+=step;
    const perc=Math.min(sfidaRuntime.progressoFocus/(DURATA_FOCUS*1000),1);
    aggiornaCerchio(perc);
    if(perc>=1){
      clearInterval(sfidaRuntime.timerFocus);
      sfidaRuntime.fase='vinto';
      completaSfida();
      renderSfidaBox();
    }
    // Aggiorna solo il cerchio senza re-render completo
    const lbl=document.getElementById('focus-lbl');
    if(lbl) lbl.textContent=Math.ceil(DURATA_FOCUS-sfidaRuntime.progressoFocus/1000);
  },step);
};

window.stopFocus = function(){
  sfidaRuntime.holdAttivo=false;
};

function aggiornaCerchio(perc){
  const el=document.getElementById('focus-prog');
  if(el) el.style.strokeDashoffset=339.3*(1-perc);
}

/* ── COMPLETAMENTO SFIDA ────────────────────────── */
function completaSfida(){
  const data=oggi();
  const stato=getSfidaStato();
  if(stato?.completata) return; // già completata oggi
  saveSfidaStato({data, tipo:sfidaRuntime.tipo, completata:true});
  const nuovoPF=addPF();
  // Controlla badge PF
  for(const b of BADGE_PF){
    if(nuovoPF>=b.soglia && addPFBadge(b.id)){
      setTimeout(()=>mostraToast(b),600);
      break;
    }
  }
  // Aggiorna display PF nella streak bar
  const pfEl=document.getElementById('pf-count');
  if(pfEl) pfEl.textContent=nuovoPF;
}

/* ── RENDER SFIDA BOX ───────────────────────────── */
function renderSfidaBox(){
  const el=document.getElementById('sfida-content');
  if(!el) return;
  el.innerHTML=buildSfidaContent();
}

function buildSfidaContent(){
  const {tipo,fase,forme,idxDiversa,scenaCambiata,idxCambiamento,azioneRivelata,progressoFocus}=sfidaRuntime;

  if(fase==='idle'){
    return `<button class="btn btn-star btn-full" onclick="avviaSfida()">Inizia la sfida →</button>`;
  }

  if(fase==='vinto'){
    return `<div class="sfida-done star-pop">
      <div class="sfida-done-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#0D1117" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>
      <div>
        <strong>Sfida completata · +1 ⭐</strong>
        <span>${MSG_FINE[tipo]||''}</span>
      </div>
    </div>`;
  }

  // ── ROMPI IL LOOP ────────────────────────────────
  if(tipo==='rompi-loop'){
    return `<p style="font-size:12px;color:var(--cream-dim);text-align:center;margin-bottom:4px">Trova la forma diversa dalle altre</p>
    <div class="forme-grid">
      ${forme.map(f=>`<button id="forma-${f.id}" class="forma" style="background:${f.colore};border-radius:${f.shape==='quadrato'?'8px':'50%'}" onclick="toccaForma(${f.id})"></button>`).join('')}
    </div>`;
  }

  // ── MICRO CORAGGIO ───────────────────────────────
  if(tipo==='micro-coraggio'){
    if(azioneRivelata){
      return `<div class="mistero-reveal">${azioneRivelata}</div>`;
    }
    return `<div style="text-align:center">
      <p style="font-size:12px;color:var(--cream-dim);margin-bottom:12px">Non saprai cosa apparirà finché non premi</p>
      <button class="mistero-btn" onclick="premiMistero()">?</button>
    </div>`;
  }

  // ── DETTAGLIO NUOVO ──────────────────────────────
  if(tipo==='dettaglio'){
    const colBase  = COLORI_SCENA[0];
    const colCamb  = COLORI_SCENA[2];
    return `<div class="scena-wrap">
      ${!scenaCambiata
        ? `<p style="font-size:12px;color:var(--cream-dim);text-align:center">Osserva la scena…</p>`
        : `<p style="font-size:12px;color:var(--cream-dim);text-align:center">Tocca l'elemento che è cambiato</p>`
      }
      <svg viewBox="0 0 300 160" style="width:100%;border-radius:10px;background:var(--navy-900);margin-top:8px">
        ${OGGETTI_SCENA.map((o,i)=>{
          const cambiato = scenaCambiata && i===idxCambiamento;
          const colore   = cambiato ? colCamb : colBase;
          const clickable= scenaCambiata ? `onclick="toccaOggetto(${i})" style="cursor:pointer"` : '';
          if(o.tipo==='cerchio')
            return `<circle id="ogg-${i}" cx="${o.x}" cy="${o.y}" r="${cambiato?o.r+6:o.r}" fill="${colore}" ${clickable}/>`;
          else
            return `<rect id="ogg-${i}" x="${o.x-o.w/2}" y="${o.y-o.h/2}" width="${cambiato?o.w+10:o.w}" height="${cambiato?o.h+10:o.h}" rx="4" fill="${colore}" ${clickable}/>`;
        }).join('')}
      </svg>
    </div>`;
  }

  // ── FOCUS 30 ─────────────────────────────────────
  if(tipo==='focus30'){
    const sec=Math.max(0,Math.ceil(DURATA_FOCUS-progressoFocus/1000));
    return `<div style="text-align:center">
      <p style="font-size:12px;color:var(--cream-dim);margin-bottom:12px">Tieni il dito premuto per 30 secondi senza spostarlo</p>
      <div class="focus-ring"
           onpointerdown="startFocus()" onpointerup="stopFocus()" onpointerleave="stopFocus()"
           onpointercancel="stopFocus()" style="touch-action:none">
        <svg class="focus-svg" viewBox="0 0 120 120">
          <circle class="focus-track" cx="60" cy="60" r="54"/>
          <circle id="focus-prog" class="focus-prog" cx="60" cy="60" r="54"/>
        </svg>
        <div class="focus-label"><span id="focus-lbl">${sec}</span></div>
      </div>
    </div>`;
  }

  return '';
}

/* ── AVVIA SFIDA (chiamata dal pulsante) ────────── */
window.avviaSfida = function(){
  const data=oggi();
  const tipo=scegliTipoSfida(data);
  inizializzaSfida(tipo);
  renderSfidaBox();
};

  };

  // Se già completata, mostra stato finale
  let contenuto;
  if(gia){
    contenuto=`<div class="sfida-done">
      <div class="sfida-done-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#0D1117" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>
      <div><strong>Sfida completata · +1 ⭐</strong><span>${MSG_FINE[tipo]||''}</span></div>
    </div>`;
  } else {
    contenuto=`<div class="sfida-box" id="sfida-content">
      <button class="btn btn-star btn-full" onclick="avviaSfida()">Inizia la sfida →</button>
    </div>`;
  }

  return `<div class="card card-star" style="animation:fadeUp .4s .3s both">
    <div class="card-header">
      <span class="tag-star">⭐ Sfida del Giorno</span>
      <span style="font-size:11px;color:#F5C842;font-weight:600">${pf} pt</span>
    </div>
    <div style="font-family:'Playfair Display',serif;font-size:20px;margin:10px 0 6px;line-height:1.25">${TITOLI[tipo]||'Sfida'}</div>
    <div style="font-size:13px;color:var(--cream-dim);line-height:1.6;margin-bottom:14px">${SOTTOTITOLI[tipo]||''}</div>
    ${contenuto}
  </div>`;
}


avvia();


</script>
</body>
</html>
