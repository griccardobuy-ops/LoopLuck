<!DOCTYPE html>
<!-- Luck Loop v5.9 -->
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Luck Loop – Missioni quotidiane per aumentare le tue opportunità reali." />
  <title>Luck Loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════
       LUCK LOOP — Design System v3.3
       Tema: cielo notturno · costellazioni · premium
    ═══════════════════════════════════════════════ */

    /* ── RESET ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── TOKEN ────────────────────────────────────── */
    :root {
      --navy-900: #080C12;
      --navy-800: #0F1520;
      --navy-700: #162030;
      --navy-600: #1E2D42;
      --navy-500: #27394F;

      --gold:     #C9A84C;
      --gold-lt:  #DFC57A;
      --gold-dim: #8A6F2E;
      --gold-glow:rgba(201,168,76,.18);

      --cream:    #EDE4D0;
      --cream-dim:#B5A485;
      --cream-xs: rgba(237,228,208,.5);

      --teal:     #4ECDC4;
      --teal-dim: #2A8F88;
      --teal-glow:rgba(78,205,196,.15);

      --amber:    #E8934A;
      --amber-glow:rgba(232,147,74,.15);

      --violet:   #9C6FDE;
      --star:     #F5C842;

      --r-xs:  8px;
      --r-sm:  12px;
      --r-md:  16px;
      --r-lg:  20px;
      --r-xl:  24px;

      --shadow-card: 0 4px 32px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.2);
      --shadow-glow-gold: 0 0 24px rgba(201,168,76,.12);
      --shadow-glow-teal: 0 0 24px rgba(78,205,196,.1);

      --ease-spring: cubic-bezier(.22,1,.36,1);
      --ease-out:    cubic-bezier(.16,1,.3,1);
      --ease-in:     cubic-bezier(.4,0,1,1);
    }

    /* ── BASE ──────────────────────────────────────── */
    html { scroll-behavior: smooth; }

    body {
      background: var(--navy-900);
      color: var(--cream);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--navy-500); border-radius: 99px; }

    /* ── SFONDO STELLATO ───────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 15% 20%, rgba(78,205,196,.04) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 75%, rgba(201,168,76,.05) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(156,111,222,.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Stelle fisse generate con box-shadow */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 8%,  rgba(255,255,255,.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 23% 15%, rgba(255,255,255,.4)  0%, transparent 100%),
        radial-gradient(1px 1px at 38% 5%,  rgba(255,255,255,.5)  0%, transparent 100%),
        radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 3%,  rgba(255,255,255,.6)  0%, transparent 100%),
        radial-gradient(1px 1px at 82% 18%, rgba(255,255,255,.45) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 8%,  rgba(255,255,255,.3)  0%, transparent 100%),
        radial-gradient(1px 1px at 5%  30%, rgba(255,255,255,.4)  0%, transparent 100%),
        radial-gradient(1px 1px at 18% 45%, rgba(255,255,255,.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 35%, rgba(255,255,255,.5)  0%, transparent 100%),
        radial-gradient(1px 1px at 68% 28%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 40%, rgba(255,255,255,.45) 0%, transparent 100%),
        radial-gradient(1px 1px at 12% 60%, rgba(255,255,255,.3)  0%, transparent 100%),
        radial-gradient(1px 1px at 30% 72%, rgba(255,255,255,.4)  0%, transparent 100%),
        radial-gradient(1px 1px at 58% 65%, rgba(255,255,255,.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 58%, rgba(255,255,255,.5)  0%, transparent 100%),
        radial-gradient(1px 1px at 95% 62%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 8%  85%, rgba(255,255,255,.4)  0%, transparent 100%),
        radial-gradient(1px 1px at 42% 90%, rgba(255,255,255,.3)  0%, transparent 100%),
        radial-gradient(1px 1px at 72% 88%, rgba(255,255,255,.45) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 25% 25%, rgba(201,168,76,.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 62% 18%, rgba(78,205,196,.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 88% 70%, rgba(201,168,76,.5) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── LAYOUT ────────────────────────────────────── */
    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 18px 96px;
      position: relative;
      z-index: 1;
    }

    /* Nebulosa ornamentale (rimpiazza glow-top/bottom) */
    .glow-top {
      position: fixed; top: -80px; right: -80px;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(201,168,76,.06) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }
    .glow-bottom {
      position: fixed; bottom: -80px; left: -80px;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(78,205,196,.06) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }

    /* ── HEADER ────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 12px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      margin-bottom: 4px;
    }

    .logo { display: flex; align-items: center; gap: 12px; }

    .logo-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, rgba(201,168,76,.2) 0%, rgba(201,168,76,.08) 100%);
      border: 1px solid rgba(201,168,76,.35);
      box-shadow: 0 0 16px rgba(201,168,76,.1), inset 0 1px 0 rgba(255,255,255,.06);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--gold);
      transition: box-shadow .3s var(--ease-out);
    }
    .logo-icon:hover { box-shadow: 0 0 24px rgba(201,168,76,.22); }

    .logo-name {
      font-family: 'Playfair Display', serif;
      font-size: 20px; color: var(--cream);
      letter-spacing: .04em;
    }

    nav { display: flex; gap: 2px; }

    nav button {
      background: none; border: none; cursor: pointer;
      color: var(--cream-dim); font-size: 13px; font-family: inherit;
      padding: 7px 12px; border-radius: var(--r-sm);
      letter-spacing: .01em;
      transition: background .2s var(--ease-out), color .2s;
    }
    nav button:hover  { color: var(--cream); background: rgba(255,255,255,.06); }
    nav button.active { background: rgba(255,255,255,.09); color: var(--cream); }

    /* ── TIPOGRAFIA ────────────────────────────────── */
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 30px; line-height: 1.15;
      letter-spacing: -.01em;
      background: linear-gradient(135deg, var(--cream) 0%, var(--cream-dim) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-date { font-size: 12px; color: var(--cream-dim); margin-bottom: 6px; letter-spacing: .03em; }
    h2.section-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px; margin-bottom: 20px; letter-spacing: -.01em;
    }
    h3.card-sub {
      font-family: 'Playfair Display', serif;
      font-size: 18px; margin-bottom: 10px; letter-spacing: -.01em;
    }
    .section-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .1em; color: var(--cream-dim); margin-bottom: 14px;
    }

    /* ── CARD BASE ─────────────────────────────────── */
    .card {
      border-radius: var(--r-lg);
      padding: 22px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      transition: box-shadow .3s var(--ease-out), transform .2s var(--ease-out);
    }
    .card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.025) 0%, transparent 60%);
      pointer-events: none;
    }
    .card:hover { transform: translateY(-1px); }

    .card-teal {
      background: linear-gradient(160deg, rgba(30,45,66,.95) 0%, rgba(22,32,48,.95) 100%);
      border: 1px solid rgba(78,205,196,.22);
      box-shadow: var(--shadow-card), var(--shadow-glow-teal);
    }
    .card-gold {
      background: linear-gradient(160deg, rgba(30,45,66,.95) 0%, rgba(22,32,48,.95) 100%);
      border: 1px solid rgba(201,168,76,.22);
      box-shadow: var(--shadow-card), var(--shadow-glow-gold);
    }
    .card-amber {
      background: linear-gradient(160deg, rgba(30,45,66,.95) 0%, rgba(22,32,48,.95) 100%);
      border: 1px solid rgba(232,147,74,.22);
      box-shadow: var(--shadow-card), 0 0 24px var(--amber-glow);
    }
    .card-glass {
      background: linear-gradient(160deg, rgba(22,32,48,.9) 0%, rgba(15,21,32,.9) 100%);
      border: 1px solid rgba(255,255,255,.07);
      box-shadow: var(--shadow-card);
    }
    .card-special {
      background: linear-gradient(160deg, rgba(30,45,66,.95) 0%, rgba(22,32,48,.95) 100%);
      border: 1px solid rgba(156,111,222,.28);
      box-shadow: var(--shadow-card), 0 0 24px rgba(156,111,222,.08);
    }
    .card-rituale {
      background: linear-gradient(160deg, rgba(30,45,66,.95) 0%, rgba(22,32,48,.95) 100%);
      border: 1px solid rgba(201,168,76,.22);
      box-shadow: var(--shadow-card), var(--shadow-glow-gold);
    }
    .card-star {
      background: linear-gradient(160deg, rgba(30,45,66,.95) 0%, rgba(22,32,48,.95) 100%);
      border: 1px solid rgba(245,200,66,.22);
      box-shadow: var(--shadow-card), 0 0 24px rgba(245,200,66,.06);
    }
    .card-dark {
      background: rgba(8,12,18,.6);
      border-radius: var(--r-sm);
      padding: 18px;
      border: 1px solid rgba(255,255,255,.05);
    }

    /* Identità visiva per categoria missione */
    .card-teal  { --cat-accent: var(--teal); }
    .card-amber { --cat-accent: var(--amber); }
    .card-gold  { --cat-accent: var(--gold); }

    /* ── TAG ───────────────────────────────────────── */
    .tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 99px;
    }
    .tag-real    { color: var(--teal);   background: rgba(78,205,196,.1);   border: 1px solid rgba(78,205,196,.2);  }
    .tag-micro   { color: var(--amber);  background: rgba(232,147,74,.1);   border: 1px solid rgba(232,147,74,.2);  }
    .tag-special { color: var(--violet); background: rgba(156,111,222,.1);  border: 1px solid rgba(156,111,222,.22); }
    .tag-rituale { color: var(--gold);   background: rgba(201,168,76,.1);   border: 1px solid rgba(201,168,76,.2);
                   font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
                   padding: 4px 12px; border-radius: 99px; display: inline-flex; }
    .tag-star    { color: var(--star);   background: rgba(245,200,66,.1);   border: 1px solid rgba(245,200,66,.2);
                   font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
                   padding: 4px 12px; border-radius: 99px; display: inline-flex; }

    /* ── IMPACT BADGE ──────────────────────────────── */
    .impact { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: var(--r-xs); letter-spacing: .02em; }
    .impact-basso { color: var(--cream-dim); background: rgba(184,169,138,.08); border: 1px solid rgba(184,169,138,.12); }
    .impact-medio { color: var(--gold);      background: rgba(201,168,76,.1);   border: 1px solid rgba(201,168,76,.18); }
    .impact-alto  { color: var(--teal);      background: rgba(78,205,196,.1);   border: 1px solid rgba(78,205,196,.18); }

    /* ── BOTTONI ───────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-family: inherit; font-weight: 600; cursor: pointer;
      border-radius: var(--r-sm); border: none;
      padding: 13px 22px; font-size: 14px; letter-spacing: .01em;
      transition: transform .15s var(--ease-spring), background .18s, box-shadow .18s, opacity .15s;
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.08) 0%, transparent 60%);
      opacity: 0; transition: opacity .2s;
    }
    .btn:hover::after  { opacity: 1; }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .38; cursor: not-allowed; transform: none; }

    .btn-primary { background: linear-gradient(135deg, var(--gold-lt) 0%, var(--gold) 100%); color: #0A0E16; box-shadow: 0 2px 16px rgba(201,168,76,.25); }
    .btn-primary:hover { box-shadow: 0 4px 24px rgba(201,168,76,.35); }

    .btn-teal    { background: rgba(78,205,196,.1);   color: var(--teal);   border: 1px solid rgba(78,205,196,.28); }
    .btn-teal:hover    { background: rgba(78,205,196,.18);  box-shadow: 0 0 16px rgba(78,205,196,.15); }

    .btn-amber   { background: rgba(232,147,74,.1);   color: var(--amber);  border: 1px solid rgba(232,147,74,.28); }
    .btn-amber:hover   { background: rgba(232,147,74,.18);  box-shadow: 0 0 16px rgba(232,147,74,.15); }

    .btn-special { background: rgba(156,111,222,.1);  color: var(--violet); border: 1px solid rgba(156,111,222,.28); }
    .btn-special:hover { background: rgba(156,111,222,.18); box-shadow: 0 0 16px rgba(156,111,222,.15); }

    .btn-star    { background: rgba(245,200,66,.1);   color: var(--star);   border: 1px solid rgba(245,200,66,.28); }
    .btn-star:hover    { background: rgba(245,200,66,.18);  box-shadow: 0 0 16px rgba(245,200,66,.15); }

    .btn-rituale { background: rgba(201,168,76,.1);   color: var(--gold);   border: 1px solid rgba(201,168,76,.28); }
    .btn-rituale:hover { background: rgba(201,168,76,.18);  box-shadow: 0 0 16px rgba(201,168,76,.15); }

    .btn-ghost   { background: transparent; color: var(--cream-dim); border: 1px solid rgba(255,255,255,.13); }
    .btn-ghost:hover   { border-color: rgba(255,255,255,.28); color: var(--cream); }

    .btn-danger  { background: transparent; color: rgba(239,68,68,.65); border: 1px solid rgba(239,68,68,.22); font-size: 13px; padding: 9px 14px; }
    .btn-danger:hover  { border-color: rgba(239,68,68,.5); color: rgba(239,68,68,.95); }

    .btn-full { width: 100%; }

    /* ── STREAK BAR ────────────────────────────────── */
    .streak-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 14px 18px;
      background: linear-gradient(160deg, rgba(22,32,48,.9) 0%, rgba(15,21,32,.9) 100%);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--r-md);
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }
    .streak-item  { display: flex; align-items: center; gap: 9px; }
    .streak-num   { font-family: 'Playfair Display', serif; font-size: 24px; line-height: 1; }
    .streak-label { font-size: 10px; color: var(--cream-dim); letter-spacing: .04em; text-transform: uppercase; }
    .streak-divider { width: 1px; height: 30px; background: rgba(255,255,255,.07); flex-shrink: 0; }
    .star-num     { font-family: 'Playfair Display', serif; font-size: 24px; line-height: 1; color: var(--star); }

    /* ── CARD HEADER / BODY ─────────────────────────── */
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
    .card-title  { font-family: 'Playfair Display', serif; font-size: 21px; margin: 12px 0 10px; line-height: 1.2; letter-spacing: -.01em; }
    .card-desc   { font-size: 14px; color: var(--cream-dim); line-height: 1.65; margin-bottom: 16px; }
    .card-icon   { font-size: 20px; opacity: .85; }

    /* ── PERCHÉ FUNZIONA (accordion) ──────────────── */
    .card-why-toggle {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
      padding: 10px 0;
      border-top: 1px solid rgba(255,255,255,.06);
      margin-bottom: 0;
    }
    .card-why-toggle span {
      font-size: 10px; font-weight: 500; text-transform: uppercase;
      letter-spacing: .08em; color: var(--cream-dim); opacity: .6;
      transition: color .2s, opacity .2s;
    }
    .card-why-toggle:hover span { opacity: 1; color: var(--teal); }
    .card-why-toggle svg { transition: transform .25s var(--ease-out); flex-shrink: 0; opacity: .5; }
    .card-why-toggle.open svg { transform: rotate(180deg); }
    .card-why-toggle.no-border { border-top: none; padding-top: 0; }
    .card-why-body {
      font-size: 13px; color: var(--cream-dim); line-height: 1.65;
      overflow: hidden; max-height: 0;
      transition: max-height .35s var(--ease-out), padding .25s;
      padding-top: 0;
    }
    .card-why-body.open { max-height: 600px; padding-top: 10px; }
    .card-why p { font-size: 13px; color: var(--cream-dim); line-height: 1.65; }

    /* ── ENERGY SELECTOR ────────────────────────────── */
    .energy-option {
      display: flex; align-items: center; gap: 16px;
      width: 100%; text-align: left;
      padding: 16px 18px; border-radius: var(--r-md);
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(160deg, rgba(22,32,48,.8) 0%, rgba(15,21,32,.8) 100%);
      cursor: pointer; font-family: inherit;
      transition: border-color .2s, background .2s, box-shadow .2s;
      margin-bottom: 10px;
    }
    .energy-option:hover   { border-color: rgba(201,168,76,.25); box-shadow: 0 0 20px rgba(201,168,76,.06); }
    .energy-option.selected { border-color: var(--gold); background: rgba(201,168,76,.07); box-shadow: 0 0 20px rgba(201,168,76,.1); }
    .energy-name { font-size: 15px; font-weight: 600; color: var(--cream); }
    .energy-desc { font-size: 12px; color: var(--cream-dim); margin-top: 1px; }
    .energy-check { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); display: none; align-items: center; justify-content: center; box-shadow: 0 0 8px rgba(201,168,76,.4); }
    .energy-option.selected .energy-check { display: flex; }

    /* ── COMPLETED STATE ────────────────────────────── */
    .completed-state {
      display: flex; align-items: center; gap: 14px;
      background: rgba(78,205,196,.07);
      border: 1px solid rgba(78,205,196,.18);
      border-radius: var(--r-sm); padding: 14px;
    }
    .completed-check {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dim) 100%);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px rgba(78,205,196,.3);
    }
    .completed-text strong { font-size: 14px; color: var(--teal); }
    .completed-text span   { font-size: 12px; color: var(--cream-dim); display: block; }

    .completed-state.special { background: rgba(156,111,222,.07); border-color: rgba(156,111,222,.18); }
    .completed-state.special .completed-check { background: linear-gradient(135deg, var(--violet) 0%, #7A50B8 100%); box-shadow: 0 0 12px rgba(156,111,222,.3); }
    .completed-state.special strong { color: var(--violet); }

    /* is-nuovo glow animato al completamento */
    .is-nuovo .completed-state { animation: completaGlow .55s var(--ease-spring) both; }
    .is-nuovo .mp-completed     { animation: completaGlowAmber .55s var(--ease-spring) both; }

    @keyframes completaGlow {
      0%   { box-shadow: 0 0 0 0 rgba(78,205,196,.45); }
      50%  { box-shadow: 0 0 0 10px rgba(78,205,196,.1); }
      100% { box-shadow: 0 0 0 0 rgba(78,205,196,0); }
    }
    @keyframes completaGlowAmber {
      0%   { box-shadow: 0 0 0 0 rgba(232,147,74,.45); }
      50%  { box-shadow: 0 0 0 10px rgba(232,147,74,.1); }
      100% { box-shadow: 0 0 0 0 rgba(232,147,74,0); }
    }


    /* ── MICRO-PRINCIPIO ────────────────────────────── */
    .mp-principio {
      background: rgba(232,147,74,.06); border: 1px solid rgba(232,147,74,.13);
      border-radius: var(--r-sm); padding: 14px; margin-bottom: 10px;
    }
    .mp-label  { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--amber); margin-bottom: 6px; }
    .mp-testo  { font-size: 13px; color: var(--cream); line-height: 1.6; }
    .mp-fonte  { font-size: 11px; color: var(--cream-dim); margin-top: 6px; font-style: italic; }
    .mp-cultura {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--r-sm); padding: 14px; margin-bottom: 10px;
    }
    .mp-cultura .mp-label { color: var(--cream-dim); }
    .mp-azione {
      background: rgba(201,168,76,.07); border: 1px solid rgba(201,168,76,.18);
      border-radius: var(--r-sm); padding: 14px; margin-bottom: 18px;
    }
    .mp-azione .mp-label  { color: var(--gold); }
    .mp-azione .mp-testo  { font-weight: 500; }
    .mp-completed {
      display: flex; align-items: center; gap: 12px;
      background: rgba(232,147,74,.07); border: 1px solid rgba(232,147,74,.18);
      border-radius: var(--r-sm); padding: 13px;
    }
    .mp-completed-check {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--amber) 0%, #C0622A 100%);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px rgba(232,147,74,.3);
    }
    .mp-completed strong { font-size: 13px; color: var(--amber); display: block; }
    .mp-completed span   { font-size: 11px; color: var(--cream-dim); }

    /* ── RITUALI ─────────────────────────────────────── */
    .rituali-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
    .rituale-btn    { background: rgba(8,12,18,.6); border: 1px solid rgba(255,255,255,.07); border-radius: var(--r-sm); padding: 14px 10px; text-align: center; cursor: pointer; font-family: inherit; transition: border-color .2s, background .2s; }
    .rituale-btn:hover   { border-color: rgba(201,168,76,.3); background: rgba(201,168,76,.05); }
    .rituale-btn.selected { border-color: var(--gold); background: rgba(201,168,76,.08); }
    .rituale-emoji  { font-size: 26px; display: block; margin-bottom: 5px; }
    .rituale-nome   { font-size: 12px; font-weight: 600; color: var(--cream); }
    .rituale-textarea {
      width: 100%; background: rgba(8,12,18,.6); border: 1px solid rgba(255,255,255,.09);
      border-radius: var(--r-sm); padding: 14px; color: var(--cream);
      font-family: 'Playfair Display', serif; font-size: 16px; line-height: 1.6;
      resize: none; outline: none; min-height: 90px; transition: border-color .2s;
    }
    .rituale-textarea:focus { border-color: rgba(201,168,76,.4); box-shadow: 0 0 16px rgba(201,168,76,.06); }
    .rituale-textarea::placeholder { color: rgba(237,228,208,.25); font-style: italic; }
    .rituale-stage { width: 100%; min-height: 130px; border-radius: var(--r-sm); background: rgba(8,12,18,.8); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.05); }
    .rituale-stage-text { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--cream); text-align: center; padding: 16px; line-height: 1.6; position: relative; z-index: 2; max-width: 90%; }
    .rituale-done { display: flex; align-items: center; gap: 12px; background: rgba(201,168,76,.07); border: 1px solid rgba(201,168,76,.2); border-radius: var(--r-sm); padding: 13px; }
    .rituale-done-icon { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%); flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(201,168,76,.3); }
    .rituale-done strong { font-size: 13px; color: var(--gold); display: block; }
    .rituale-done span   { font-size: 11px; color: var(--cream-dim); }

    /* ── COSTELLAZIONE ───────────────────────────────── */
    .costellazione-wrap {
      margin-bottom: 0;
      background: linear-gradient(160deg, rgba(15,21,32,.95) 0%, rgba(8,12,18,.95) 100%);
      border: 1px solid rgba(201,168,76,.1);
      border-radius: var(--r-xl);
      padding: 22px 18px 16px;
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.04);
      position: relative; overflow: hidden;
    }
    .costellazione-wrap::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(201,168,76,.04) 0%, transparent 70%);
      pointer-events: none;
    }
    .costellazione-svg { display: block; width: 100%; }
    .stella-attiva  { fill: var(--gold); filter: drop-shadow(0 0 4px rgba(201,168,76,.7));
                      opacity: 0; animation: stellaComparsa 1.3s ease-out forwards; }
    .stella-recente { fill: var(--gold-lt); filter: drop-shadow(0 0 6px rgba(201,168,76,.9));
                      opacity: 0; animation: stellaComparsa 1.3s ease-out forwards, stellaPulse 2.5s ease-in-out 1.8s infinite; }
    @keyframes stellaComparsa {
      0%   { opacity: 0;   filter: brightness(1)   drop-shadow(0 0 0px  rgba(201,168,76,0)); }
      30%  { opacity: .25; filter: brightness(1.5) drop-shadow(0 0 8px  rgba(201,168,76,.5)); }
      55%  { opacity: .55; filter: brightness(2)   drop-shadow(0 0 16px rgba(201,168,76,.8)); }
      80%  { opacity: .9;  filter: brightness(1.4) drop-shadow(0 0 10px rgba(201,168,76,.6)); }
      100% { opacity: 1;   filter: brightness(1)   drop-shadow(0 0 4px  rgba(201,168,76,.5)); }
    }
    @keyframes stellaPulse {
      0%,100% { filter: drop-shadow(0 0 3px rgba(201,168,76,.5)); opacity: .9; }
      50%      { filter: drop-shadow(0 0 9px rgba(201,168,76,.95)); opacity: 1; }
    }
    .linea-cost-attiva {
      stroke: rgba(201,168,76,.28); stroke-linecap: round;
      opacity: 0; animation: lineaComparsa .6s var(--ease-out) forwards;
    }
    @keyframes lineaComparsa {
      from { opacity: 0; }
      to   { opacity: var(--linea-op, 1); }
    }
    .costellazione-label { font-size: 12px; color: var(--cream-dim); text-align: center; margin-top: 12px; font-style: italic; letter-spacing: .03em; }

    /* Navigazione tra costellazioni passate e quella in corso */
    .costellazione-nav-wrap { margin-bottom: 22px; }
    .costellazione-nav {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin-top: 10px;
    }
    .costellazione-nav-btn {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
      color: var(--cream-dim); font-size: 16px; line-height: 1;
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, color .2s, opacity .2s;
    }
    .costellazione-nav-btn:hover:not(:disabled) { border-color: rgba(201,168,76,.4); color: var(--gold); }
    .costellazione-nav-btn:disabled { opacity: .25; cursor: default; }
    .costellazione-nav-label {
      font-size: 11px; color: var(--cream-dim); letter-spacing: .04em;
      min-width: 160px; text-align: center;
    }
    .costellazione-num   { font-size: 10px; color: rgba(255,255,255,.2); text-align: center; margin-top: 4px; letter-spacing: .07em; text-transform: uppercase; }

    /* ── ARCHIVIO ────────────────────────────────────── */
    .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 12px; }
    .stat-box {
      background: linear-gradient(160deg, rgba(22,32,48,.9) 0%, rgba(15,21,32,.9) 100%);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--r-md); padding: 14px 10px; text-align: center;
      box-shadow: var(--shadow-card);
    }
    .stat-num   { font-family: 'Playfair Display', serif; font-size: 26px; line-height: 1; }
    .stat-label { font-size: 10px; color: var(--cream-dim); letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
    .badge-row  { display: flex; align-items: center; gap: 12px; padding: 11px; border-radius: var(--r-sm); margin-bottom: 6px; transition: background .2s; }
    .badge-row.earned { background: rgba(201,168,76,.07); border: 1px solid rgba(201,168,76,.16); }
    .badge-row.locked { opacity: .32; }
    .badge-emoji { font-size: 22px; }
    .badge-name  { font-size: 13px; font-weight: 600; color: var(--gold); }
    .badge-desc  { font-size: 11px; color: var(--cream-dim); }
    .history-item {
      background: rgba(8,12,18,.5); border: 1px solid rgba(255,255,255,.05);
      border-radius: var(--r-sm); padding: 11px; margin-bottom: 7px;
      transition: border-color .2s, background .25s var(--ease-out);
      cursor: pointer;
    }
    .history-item:hover { border-color: rgba(255,255,255,.1); }
    .history-item.expanded { background: rgba(78,205,196,.04); border-color: rgba(78,205,196,.16); }
    .history-row { display: flex; align-items: center; gap: 11px; }
    .history-icon  { font-size: 18px; opacity: .85; flex-shrink: 0; }
    .history-title {
      font-size: 13px; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: white-space 0s;
    }
    .history-item.expanded .history-title {
      white-space: normal; overflow: visible; text-overflow: clip;
    }
    .history-meta  { font-size: 11px; color: var(--cream-dim); margin-top: 1px; }
    .history-check { width: 20px; height: 20px; border-radius: 50%; background: rgba(78,205,196,.15); flex-shrink: 0; margin-left: auto; display: flex; align-items: center; justify-content: center; }
    .history-detail {
      overflow: hidden; max-height: 0;
      transition: max-height .35s var(--ease-out), padding .25s var(--ease-out), opacity .3s;
      opacity: 0;
    }
    .history-item.expanded .history-detail {
      max-height: 200px; padding-top: 9px; margin-top: 9px;
      border-top: 1px solid rgba(255,255,255,.06);
      opacity: 1;
    }
    .history-detail-text { font-size: 12px; color: var(--cream-dim); line-height: 1.6; }

    /* ── Follow-up: invito discreto, nascosto finché non richiesto ── */
    .followup-link {
      background: none; border: none; cursor: pointer;
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 12px; color: var(--cream-dim); opacity: .55;
      padding: 0; text-decoration: underline;
      text-decoration-color: rgba(201,168,76,.3);
      text-underline-offset: 3px;
      transition: opacity .2s, color .2s;
    }
    .followup-link:hover { opacity: 1; color: var(--gold); }

    .followup-prompt { display: flex; flex-direction: column; gap: 10px; }
    .followup-question {
      font-size: 12px; color: var(--cream-dim); font-style: italic; line-height: 1.5;
    }
    .followup-options { display: flex; gap: 6px; flex-wrap: wrap; }
    .followup-options button {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
      color: var(--cream-dim); font-family: inherit; font-size: 11px;
      padding: 6px 12px; border-radius: 99px; cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
    }
    .followup-options button:hover {
      border-color: rgba(201,168,76,.35); color: var(--gold); background: rgba(201,168,76,.06);
    }

    .followup-textarea {
      width: 100%; background: rgba(8,12,18,.6); border: 1px solid rgba(255,255,255,.09);
      border-radius: var(--r-sm); padding: 10px 12px; color: var(--cream);
      font-family: 'Playfair Display', serif; font-size: 13px; line-height: 1.5;
      resize: none; outline: none; transition: border-color .2s;
    }
    .followup-textarea:focus { border-color: rgba(201,168,76,.35); }
    .followup-textarea::placeholder { color: rgba(237,228,208,.3); font-style: italic; }
    .followup-save {
      align-self: flex-start;
      background: rgba(201,168,76,.1); border: 1px solid rgba(201,168,76,.28);
      color: var(--gold); font-family: inherit; font-size: 11px; font-weight: 600;
      padding: 6px 16px; border-radius: 99px; cursor: pointer;
      transition: background .2s;
    }
    .followup-save:hover { background: rgba(201,168,76,.18); }

    .followup-esito {
      font-size: 12px; color: var(--cream-dim); font-style: italic;
      line-height: 1.5; opacity: .75;
    }
    .followup-nota {
      font-size: 12px; color: var(--cream-dim); font-style: italic;
      line-height: 1.6; padding-left: 2px;
    }

    /* ── DONE BANNER ─────────────────────────────────── */
    .done-banner { text-align: center; padding: 28px 0 10px; }
    .done-emoji  { font-size: 38px; margin-bottom: 10px; display: block; }
    .done-title  { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 5px; letter-spacing: -.01em; }
    .done-sub    { font-size: 13px; color: var(--cream-dim); }
    .streak-pill { display: inline-flex; align-items: center; gap: 7px; background: rgba(201,168,76,.1); border: 1px solid rgba(201,168,76,.22); border-radius: 99px; padding: 7px 18px; font-size: 13px; font-weight: 600; color: var(--gold); margin-top: 14px; }

    /* ── SFIDA / FOCUS ────────────────────────────────── */
    .focus-ring  { position: relative; width: 120px; height: 120px; touch-action: none; cursor: pointer; }
    .focus-svg   { width: 120px; height: 120px; transform: rotate(-90deg); }
    .focus-track { fill: none; stroke: rgba(255,255,255,.06); stroke-width: 9; }
    .focus-prog  { fill: none; stroke: var(--star); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 339.3; stroke-dashoffset: 339.3; transition: stroke-dashoffset .08s linear; }
    .focus-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 26px; }
    .mistero-btn { width: 72px; height: 72px; border-radius: 50%; background: rgba(245,200,66,.1); border: 2px solid rgba(245,200,66,.3); font-size: 30px; cursor: pointer; transition: transform .18s var(--ease-spring), background .2s; display: flex; align-items: center; justify-content: center; }
    .mistero-btn:hover { background: rgba(245,200,66,.2); transform: scale(1.06); }
    .mistero-reveal { font-size: 14px; color: var(--cream); line-height: 1.6; text-align: center; max-width: 240px; animation: fadeUp .35s var(--ease-spring); }
    .sfida-done { display: flex; align-items: center; gap: 11px; background: rgba(245,200,66,.07); border: 1px solid rgba(245,200,66,.2); border-radius: var(--r-sm); padding: 13px; }
    .sfida-done-icon { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--star) 0%, #C9A010 100%); flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(245,200,66,.3); }
    .sfida-done strong { font-size: 13px; color: var(--star); display: block; }
    .sfida-done span   { font-size: 11px; color: var(--cream-dim); }
    .forme-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .forma { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; transition: transform .15s var(--ease-spring); display: flex; align-items: center; justify-content: center; border: none; }
    .forma:active { transform: scale(.88); }

    /* ── LOADER ENERGIA ──────────────────────────────── */
    .loader-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 0; gap: 20px; animation: fadeUp .35s var(--ease-spring) both; }
    .loader-testo { font-size: 17px; color: var(--cream); letter-spacing: .01em; font-family: 'Playfair Display', serif; animation: loaderPulse 1.8s ease-in-out infinite; }
    .loader-dots { display: flex; gap: 7px; }
    .loader-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); display: block; }
    .loader-dots span:nth-child(1) { animation: loaderDot 1.2s 0s   ease-in-out infinite; }
    .loader-dots span:nth-child(2) { animation: loaderDot 1.2s .2s  ease-in-out infinite; }
    .loader-dots span:nth-child(3) { animation: loaderDot 1.2s .4s  ease-in-out infinite; }

    /* ── FEEDBACK / BACK / DEBUG ─────────────────────── */
    .feedback-msg { text-align: center; font-size: 12px; color: var(--cream-dim); font-style: italic; padding: 9px 0 2px; animation: feedbackPop .45s var(--ease-spring) both; }
    .completamento-label { font-size: 11px; color: var(--teal); font-weight: 500; opacity: 0; animation: fadeLabel .4s .1s var(--ease-spring) forwards; text-align: center; margin-top: 6px; }
    .completamento-label.amber { color: var(--amber); }
    .back-btn { display: inline-flex; align-items: center; gap: 7px; background: none; border: none; color: var(--cream-dim); font-family: inherit; font-size: 13px; cursor: pointer; margin-bottom: 22px; padding: 0; transition: color .2s; letter-spacing: .01em; }
    .back-btn:hover { color: var(--cream); }
    .debug-toggle { background: none; border: none; color: rgba(255,255,255,.18); font-size: 11px; font-family: inherit; cursor: pointer; margin-top: 24px; letter-spacing: .02em; }
    .debug-toggle:hover { color: rgba(255,255,255,.35); }
    .debug-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    /* ── COME FUNZIONA ───────────────────────────────── */
    .how-section { margin-bottom: 14px; }
    .how-list li { display: flex; gap: 9px; font-size: 13px; color: var(--cream-dim); margin-bottom: 8px; line-height: 1.6; list-style: none; }
    .how-list li::before { content: '→'; color: var(--teal); flex-shrink: 0; }
    .no-list  li { display: flex; gap: 9px; font-size: 13px; color: var(--cream-dim); margin-bottom: 8px; list-style: none; }
    .no-list  li::before { content: '✕'; color: #f87171; flex-shrink: 0; }

    /* ── TOAST BADGE ─────────────────────────────────── */
    #badge-toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(90px); background: linear-gradient(160deg, rgba(22,32,48,.98) 0%, rgba(15,21,32,.98) 100%); border: 1px solid rgba(201,168,76,.3); border-radius: 20px; padding: 18px 22px; display: flex; align-items: center; gap: 16px; min-width: 270px; z-index: 100; box-shadow: 0 16px 48px rgba(0,0,0,.6), 0 0 32px rgba(201,168,76,.1); transition: transform .45s var(--ease-spring), opacity .4s; opacity: 0; pointer-events: none; }
    #badge-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast-label { font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }
    .toast-title { font-family: 'Playfair Display', serif; font-size: 18px; line-height: 1.1; }
    .toast-desc  { font-size: 11px; color: var(--cream-dim); margin-top: 2px; }

    /* ── STAR POP ────────────────────────────────────── */
    .star-pop { animation: starPop .55s var(--ease-spring) both; }
    .star-num  { font-family: 'Playfair Display', serif; font-size: 24px; line-height: 1; color: var(--star); }

    /* ── SCENA RITUALE ───────────────────────────────── */
    .scena-wrap { position: relative; width: 100%; max-width: 280px; }

    /* ── KEYFRAMES ───────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .flip-in { animation: flipIn .5s var(--ease-spring) both; }
    @keyframes flipIn {
      from { opacity:0; transform:rotateY(-55deg) translateY(6px); }
      to   { opacity:1; transform:rotateY(0) translateY(0); }
    }
    .page    { animation: fadeUp .4s var(--ease-spring) both; }

    @keyframes loaderPulse  { 0%,100%{opacity:.35}50%{opacity:1} }
    @keyframes loaderDot    { 0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)} }
    @keyframes feedbackPop  { 0%{opacity:0;transform:translateY(6px) scale(.97)}50%{opacity:1;transform:translateY(-1px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes fadeLabel    { from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)} }
    @keyframes starPop      { 0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.25) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1} }

    @keyframes fuoco        { 0%{color:var(--cream);text-shadow:none;opacity:1}25%{color:#E8934A;text-shadow:0 0 8px rgba(232,147,74,.6);opacity:1}60%{color:#C9A84C;text-shadow:0 0 16px rgba(201,168,76,.8);opacity:.7}100%{color:rgba(180,180,180,.2);text-shadow:none;opacity:0;transform:translateY(-12px)} }
    @keyframes scorri       { 0%{transform:translateX(0);opacity:1}30%{transform:translateX(0);opacity:1}100%{transform:translateX(110%);opacity:0} }
    @keyframes foglia-vola  { 0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}100%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(.4)} }
    @keyframes paginaGira   { 0%{transform:perspective(600px) rotateY(0deg);opacity:1}50%{transform:perspective(600px) rotateY(-90deg);opacity:.3}100%{transform:perspective(600px) rotateY(-180deg);opacity:0} }
    @keyframes ondaMove     { 0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)} }
    @keyframes germoglia    { from{stroke-dashoffset:200;opacity:0}to{stroke-dashoffset:0;opacity:1} }
    @keyframes respiroShrink { from{stroke-dashoffset:0}to{stroke-dashoffset:276.5} }
    @keyframes correctFlash  { 0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)} }
    @keyframes wrongShake    { 0%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}100%{transform:translateX(0)} }

    /* ── REDUCED MOTION ──────────────────────────────── */
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }

    /* ══════════════════════════════════════════════
       HOME PREMIUM — v3.4
    ══════════════════════════════════════════════ */

    /* Hero decorativa */
    .home-hero {
      position: relative;
      padding: 28px 0 8px;
      margin-bottom: 4px;
    }
    .hero-constellation {
      position: absolute;
      top: 0; left: -18px; right: -18px;
      height: 160px;
      pointer-events: none;
      opacity: .22;
    }
    .hero-title-wrap {
      position: relative;
      z-index: 2;
    }

    /* Stelle scintillanti nella hero */
    @keyframes twinkle {
      0%,100% { opacity:.2; transform:scale(.8); }
      50%      { opacity:1;  transform:scale(1.2); }
    }
    .star-twinkle {

  {id:'r24',categoria:'sociale',energia:['media'],titolo:"Condividi qualcosa che hai imparato di recente",descrizione:"Scrivi un messaggio, un post o una nota per un gruppo in cui partecipi. Non una lezione: solo una cosa interessante che hai scoperto.",impatto:'medio',perche:"Condividere conoscenza costruisce una reputazione di persona curiosa e generosa — due tratti correlati alle opportunità."},

  {id:'r26',categoria:'sociale',energia:['bassa','media'],titolo:"Manda un messaggio di ringraziamento specifico",descrizione:"Pensa a qualcuno che ha fatto qualcosa per te — anche tempo fa. Mandagli un messaggio che descrive esattamente cosa ha fatto e cosa ha significato.",impatto:'medio',perche:"La gratitudine specifica rafforza i legami più della gratitudine generica e viene ricordata a lungo da chi la riceve."},

  {id:'r07',categoria:'esplorazione',energia:['media','alta'],titolo:"Entra in un posto che non hai mai frequentato",descrizione:"Un bar, una libreria, un negozio, un parco. Entra senza obiettivo e osserva.",impatto:'medio',perche:"L'esposizione a nuovi ambienti allarga il campo delle possibilità percepite."},

  {id:'r33',categoria:'esplorazione',energia:['media'],titolo:"Segui un tutorial su qualcosa che non sai fare",descrizione:"Scegli qualcosa di pratico che non hai mai imparato. Cucina, codice, disegno, strumento, tecnica. Fallo per 20 minuti senza aspettarti di diventare bravo.",impatto:'medio',perche:"L'apprendimento di nuove skill amplia la mappa mentale delle possibilità e riduce la paura dell'incapacità."},
  {id:'r34',categoria:'esplorazione',energia:['media'],titolo:"Osserva il tuo ambiente con occhi da straniero",descrizione:"Scegli un posto che frequenti ogni giorno. Cammina o siediti lì per 15 minuti come se fosse la prima volta. Nota tre cose che non avevi mai visto.",impatto:'basso',perche:"La familiarità riduce la percezione. Rompere il filtro dell'abitudine allena il cervello a notare dettagli e opportunità che l'automazione nasconde."},

  {id:'r40',categoria:'abitudini',energia:['media'],titolo:"Leggi per 30 minuti qualcosa di lungo e impegnativo",descrizione:"Non un articolo breve. Un saggio, un capitolo di un libro, un report. Qualcosa che richiede attenzione sostenuta. Niente highlights: solo lettura.",impatto:'medio',perche:"La lettura profonda allena la capacità di attenzione sostenuta — una delle risorse cognitive più preziose nell'era della distrazione."},

/* ══════════════════════════════════════════════════
   SEED — generazione deterministica
══════════════════════════════════════════════════ */
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=Math.imul(31,h)+s.charCodeAt(i)|0;return Math.abs(h);}
function mkRng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};}
function rngVal(data,sale){const r=mkRng(hash(data+sale));r();return r();}

/* ══════════════════════════════════════════════════
   REGISTRAZIONE EVENTI — aggiorna la memoria utente
══════════════════════════════════════════════════ */
function registraCompletamento(missione){
  const m=getMem();
  // Aggiungi a completate
  m.completate.unshift({id:missione.id,categoria:missione.categoria,data:oggi(),speciale:!!missione.speciale});
  m.completate=m.completate.slice(0,100);

  // Peso categoria: +0.2, clamp 0.5–2.0
  if(m.categorie[missione.categoria]!==undefined){
    m.categorie[missione.categoria]=Math.min(2.0, m.categorie[missione.categoria]+0.2);
  }

  // Reset contatori sociali se missione sociale completata
  if(missione.categoria==='sociale') m.socialeSenza=0;

  // Reset altaIgnorataDa se energia alta completata
  saveMem(m);
}

function registraIgnorata(missione, energia){
  if(!missione) return;
  const m=getMem();
  // Aggiungi a ignorate
  m.ignorate.unshift({id:missione.id,categoria:missione.categoria,energia,data:oggi()});
  m.ignorate=m.ignorate.slice(0,100);

  // Peso categoria: -0.3, clamp 0.5–2.0
  if(!missione.speciale && m.categorie[missione.categoria]!==undefined){
    m.categorie[missione.categoria]=Math.max(0.5, m.categorie[missione.categoria]-0.3);
  }

  // Conta energia ignorata
  if(m.energiaIgnorata[energia]!==undefined) m.energiaIgnorata[energia]++;

  // Conta giorni senza sociale
  if(missione.categoria!=='sociale') m.socialeSenza=(m.socialeSenza||0)+1;

  // Conta giorni con alta ignorata
  if(energia==='alta') m.altaIgnorataDa=(m.altaIgnorataDa||0)+1;
  else m.altaIgnorataDa=0;

  saveMem(m);
}

/* ══════════════════════════════════════════════════
   ANTI-RIPETIZIONE — basata su esperienza, non su data
   Esclude missioni completate negli ultimi 30 giorni.
   Se pool < 3, include le meno recenti (fallback).
══════════════════════════════════════════════════ */
const FINESTRA = 30;

function dataRecentiSet(n){
  const s=new Set();
  for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);s.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);}
  return s;
}

function idCompletateRecenti(){
  const rec=dataRecentiSet(FINESTRA);
  const mem=getMem();
  return new Set(mem.completate.filter(e=>rec.has(e.data)).map(e=>e.id));
}

function idxMicroRecenti(){
  const rec=dataRecentiSet(FINESTRA);
  return new Set((sg(KK.MP)||[]).filter(e=>rec.has(e.data)).map(e=>e.idx));
}

function addMissioneHist(id,data){const h=sg(KK.MR)||[];h.push({id,data});ss(KK.MR,h.slice(-60));}
function addMicroHist(idx,data){const h=sg(KK.MP)||[];h.push({idx,data});ss(KK.MP,h.slice(-60));}

/* ══════════════════════════════════════════════════
   PESO DINAMICO — cuore del sistema reattivo
   peso = base(categoria) + bonus streak + malus inattività
══════════════════════════════════════════════════ */
function calcolaPesi(pool, mem, streakCorrente){
  // Bonus streak alta: favorisce sociale/esplorazione
  const bonusStreak = streakCorrente >= 5 ? 0.3 : 0;

  return pool.map(m=>{
    let peso = mem.categorie[m.categoria] || 1.0;

    // Bonus streak per categorie che ampliano le opportunità
    if(streakCorrente>=5 && (m.categoria==='sociale'||m.categoria==='esplorazione')){
      peso += bonusStreak;
    }

    // Malus se energia alta è stata ignorata spesso
    // (non eliminare, solo ridurre la probabilità di missioni impegnative)
    const altaIgn = mem.altaIgnorataDa||0;
    if(altaIgn>=3 && m.impatto==='alto'){
      peso = Math.max(0.3, peso-0.4);
    }

    // Bonus abitudini se utente inattivo (socialeSenza alto)
    if((mem.socialeSenza||0)>=5 && m.categoria==='abitudini'){
      peso += 0.3;
    }

    return {missione:m, peso:Math.max(0.3, Math.min(2.0, peso))};
  });
}

/* ══════════════════════════════════════════════════
   SELEZIONE MISSIONE REALE (reattiva)
══════════════════════════════════════════════════ */
function scegliMissioneReale(data, energia, mem, streakCorrente){
  // 1. Pool base filtrato per energia
  let pool = MISSIONI_REALI.filter(m=>m.energia.includes(energia));
  if(!pool.length) pool=[...MISSIONI_REALI];

  // 2. Anti-ripetizione: rimuovi completate negli ultimi 30gg
  const viste = idCompletateRecenti();
  let disp = pool.filter(m=>!viste.has(m.id));

  // 3. Fallback se pool troppo piccolo
  if(disp.length<3){
    const hist=sg(KK.MR)||[];
    const ultime={};hist.forEach(e=>{ultime[e.id]=e.data;});
    const fallback=pool.filter(m=>viste.has(m.id))
      .sort((a,b)=>(ultime[a.id]||'0')<(ultime[b.id]||'0')?-1:1)
      .slice(0,3-disp.length);
    disp=[...disp,...fallback];
  }

  // 4. Calcola pesi dinamici
  const pesati = calcolaPesi(disp, mem, streakCorrente);

  // 5. Costruisci lottery pesata
  const lottery=[];
  pesati.forEach(({missione,peso})=>{
    const slots=Math.max(1,Math.round(peso*10));
    for(let i=0;i<slots;i++) lottery.push(missione);
  });

  // 6. Selezione deterministica per data+energia (riproducibile)
  const r=mkRng(hash(data+'miss2'+energia));r();
  return lottery[Math.min(Math.floor(r()*lottery.length),lottery.length-1)]||disp[0]||pool[0];
}

/* ══════════════════════════════════════════════════
   SELEZIONE MICRO-PRINCIPIO (reattiva)
   Orienta il principio verso il comportamento prevalente:
   - Completa spesso sociale → principi su relazioni
   - Evita sociale → principi su psicologia individuale
   - Completa abitudini → principi su routine
══════════════════════════════════════════════════ */
function scegliMicro(data, mem){
  const visti=idxMicroRecenti();
  let cand=MICRO_PRINCIPI.map((_,i)=>i).filter(i=>!visti.has(i));
  if(cand.length<3){
    const hist=sg(KK.MP)||[];
    const ultime={};hist.forEach(e=>{ultime[e.idx]=e.data;});
    const fallback=MICRO_PRINCIPI.map((_,i)=>i).filter(i=>visti.has(i))
      .sort((a,b)=>(ultime[a]||'0')<(ultime[b]||'0')?-1:1).slice(0,3-cand.length);
    cand=[...cand,...fallback];
  }

  // Determina orientamento prevalente dall'utente
  const catPrev = Object.entries(mem.categorie)
    .sort((a,b)=>b[1]-a[1])[0][0]; // categoria con peso maggiore

  // Mappa categoria → tema micro-principio
  const temaFav = catPrev==='sociale' ? 'relazioni'
                : catPrev==='abitudini' ? 'abitudini'
                : 'individuale';

  // Costruisci lista pesata: principi del tema favorito hanno peso 2x
  const pesati=[];
  cand.forEach(idx=>{
    const tag=tagDiMicro(idx);
    const slots=tag===temaFav?2:1;
    for(let i=0;i<slots;i++) pesati.push(idx);
  });

  const r=mkRng(hash(data+'mp3'));r();
  const pick=pesati[Math.min(Math.floor(r()*pesati.length),pesati.length-1)];
  return{idx:pick, dato:MICRO_PRINCIPI[pick]||MICRO_PRINCIPI[0]};
}

/* ══════════════════════════════════════════════════
   EVENTI ADATTIVI — non random puro, ma condizionati
   al comportamento recente dell'utente
══════════════════════════════════════════════════ */
function controllaEventoSpeciale(data, mem, streakCorrente){
  const altaIgn  = mem.altaIgnorataDa||0;
  const senzaSoc = mem.socialeSenza||0;
  const baseProb = rngVal(data,'special3');

  // Trigger 1: "Sfida Coraggio" — solo se alta energia ignorata da 3+ giorni
  if(altaIgn>=3 && baseProb<0.12){
    return MISSIONI_SPECIALI[1]; // Sfida Coraggio
  }

  // Trigger 2: "Connessione Umana" — se nessun sociale completato da 5+ giorni
  if(senzaSoc>=5 && baseProb<0.15){
    return MISSIONI_SPECIALI[2]; // Connessione Umana
  }

  // Trigger 3: "Reset Loop" — streak lunga (10+) con bassa varietà categorie
  if(streakCorrente>=10){
    const pesi=Object.values(mem.categorie);
    const maxPeso=Math.max(...pesi);
    const minPeso=Math.min(...pesi);
    // Bassa varietà = una categoria domina molto
    if(maxPeso-minPeso>1.0 && baseProb<0.08){
      return {...MISSIONI_SPECIALI[0], titolo:"Reset Loop — esci dal pattern", tipoSpeciale:"Reset"};
    }
  }

  // Evento raro generico (~3%)
  if(baseProb<0.03){
    const r=mkRng(hash(data+'sp4'));r();
    return MISSIONI_SPECIALI[Math.min(Math.floor(r()*MISSIONI_SPECIALI.length),MISSIONI_SPECIALI.length-1)];
  }

  return null;
}

/* ══════════════════════════════════════════════════
   COSTRUZIONE GIORNATA (reattiva)
══════════════════════════════════════════════════ */
function costruisciGiornata(data, energia){
  const mem = getMem();
  const str = streak();

  const mSpec  = controllaEventoSpeciale(data, mem, str.corrente);
  const mReale = mSpec || scegliMissioneReale(data, energia, mem, str.corrente);
  const {idx:mpIdx, dato:mpDato} = scegliMicro(data, mem);

  return{
    data, energia,
    missioneReale:   mReale,
    missioneSpeciale:!!mSpec,
    microPrincipio:  mpDato,
    microIdx:        mpIdx,
    realeCompletata: false,
    microCompletato: false,
    _mId:  mReale.id,
    _mpIdx:mpIdx,
  };
}

/* ══════════════════════════════════════════════════
   MIGRAZIONE AUTOMATICA da v1.0 / v1.1 / v1.2
══════════════════════════════════════════════════ */
function migra(s){
  if(!s) return s;
  if(!s.microPrincipio){const{idx,dato}=scegliMicro(s.data||oggi(),getMem());s.microPrincipio=dato;s.microIdx=idx;s.microCompletato=false;}
  if(s.missioneSpeciale===undefined) s.missioneSpeciale=false;
  if(!s._mId)  s._mId=s.missioneReale?.id||'';
  if(s._mpIdx===undefined) s._mpIdx=s.microIdx||0;
  return s;
}

      ?`<div class="mp-completed"><div class="mp-completed-check"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div><div><strong>Principio applicato</strong><span>Hai messo in pratica la scienza oggi</span></div></div><div class="feedback-msg">${fraseFeedback()}</div>`
      :`<button class="btn btn-amber btn-full" onclick="completaMicro()">Ho applicato questa micro-azione</button>`
    }
  </div>`;
}

/* ══════════════════════════════════════════════════
   COSTELLAZIONI PROCEDURALI

   ciclo in renderCostellazione — nessuna forma

══════════════════════════════════════════════════ */

  // Topologia Onda: doppia linea ondulata parallela

    linee:[[0,1],[1,2],[2,3],[3,4],[4,5],[2,6],[6,7],[7,8],[8,9],[2,10],[10,11],[11,12],[12,13],[1,14],[3,15],[9,5],[13,5]]},
];

/* ── Generatore di coordinate procedurali ─────────────────────────────────
   Ogni topologia ha una funzione che posiziona 16 stelle nello spazio
   (coordinate 0-200 x, 0-120 y) usando il seed del ciclo.
   Lo stesso seed produce sempre la stessa forma — ma seed diversi
   producono forme visibilmente diverse.
────────────────────────────────────────────────────────────────────────── */
function generaStelle(topologia, rng){
  const W=200, H=120, cx=100, cy=60;
  // Funzione di jitter locale: sposta un punto entro ±delta
  const j = (v, delta) => v + (rng()-0.5)*2*delta;

  switch(topologia){

    case 'bussola': {
      // Croce cardinale con bracci di lunghezza variabile
      const r1=j(38,8), r2=j(28,6), r3=j(50,10);
      return [
        [cx,   cy-r1],    // N
        [cx+r1,cy],       // E
        [cx,   cy+r1],    // S
        [cx-r1,cy],       // W
        [cx,   cy],       // centro
        [cx+j(r2,5), cy-j(r2,5)],  // NE
        [cx+j(r2,5), cy+j(r2,5)],  // SE
        [cx-j(r2,5), cy+j(r2,5)],  // SW
        [cx+r3, cy-j(15,5)],
        [cx-r3, cy-j(15,5)],
        [cx+r3, cy+j(15,5)],
        [cx-r3, cy+j(15,5)],
        [cx+j(20,8), cy-r3*0.6],
        [cx-j(20,8), cy-r3*0.6],
        [cx+j(20,8), cy+r3*0.6],
        [cx-j(20,8), cy+r3*0.6],
      ];
    }

    case 'spirale': {
      // Spirale con raggio e passo angolare variabili
      const rStart=j(8,4), rEnd=j(55,8), giri=1.8+rng()*0.6;
      return Array.from({length:16},(_,i)=>{
        const t = i/15;
        const r = rStart + (rEnd-rStart)*t;
        const angolo = t * giri * Math.PI*2 + rng()*0.15;
        return [cx+r*Math.cos(angolo), cy+r*Math.sin(angolo)*0.65];
      });
    }

    case 'albero': {
      // Albero con tronco e ramificazioni di lunghezza variabile
      const altezza=j(80,12), ramL=j(30,8), ramM=j(22,6), ramS=j(14,4);
      const baseY=cy+altezza*0.35;
      return [
        [cx, baseY],                              // base tronco
        [cx+j(3,3), baseY-j(22,5)],              // tronco 1
        [cx+j(2,3), baseY-j(44,5)],              // tronco 2
        [cx+j(2,3), baseY-j(62,5)],              // tronco 3 (vetta)
        [cx-ramL, baseY-j(42,5)],                // ramo sx basso
        [cx+ramL, baseY-j(42,5)],                // ramo dx basso
        [cx-ramM, baseY-j(58,5)],                // ramo sx medio
        [cx+ramM, baseY-j(58,5)],                // ramo dx medio
        [cx-ramS, baseY-j(70,4)],                // foglia sx alto
        [cx+ramS, baseY-j(70,4)],                // foglia dx alto
        [cx-ramL-j(10,6), baseY-j(32,5)],
        [cx+ramL+j(10,6), baseY-j(32,5)],
        [cx-ramM-j(8,5), baseY-j(50,4)],
        [cx+ramM+j(8,5), baseY-j(50,4)],
        [cx-j(8,4), baseY-j(78,4)],
        [cx+j(8,4), baseY-j(78,4)],
      ];
    }

    case 'onda': {
      // Due onde orizzontali parallele con ampiezza variabile
      const amp1=j(22,6), amp2=j(16,5);
      const y1=cy-j(18,6), y2=cy+j(18,6);
      return [
        ...Array.from({length:8},(_,i)=>{
          const t=i/7, x=15+t*170;
          return [x+j(2,3), y1+amp1*Math.sin(t*Math.PI*2+rng()*0.3)];
        }),
        ...Array.from({length:8},(_,i)=>{
          const t=i/7, x=15+t*170;
          return [x+j(2,3), y2+amp2*Math.sin(t*Math.PI*2+rng()*0.4+0.5)];
        }),
      ];
    }

    case 'montagna': {
      // Profilo montagna con doppia vetta asimmetrica
      const v1x=j(80,12), v1y=j(15,6);
      const v2x=j(130,12), v2y=j(25,8);
      const baseY=cy+j(42,8);
      return [
        [j(15,5),  baseY],
        [j(40,5),  baseY-j(20,6)],
        [v1x,      v1y],
        [j(105,5), j(35,8)],
        [v2x,      v2y],
        [j(155,5), baseY-j(20,6)],
        [j(185,5), baseY],
        [j(55,5),  baseY-j(35,6)],
        [j(88,5),  j(45,8)],
        [j(112,5), j(40,8)],
        [j(142,5), baseY-j(30,6)],
        [j(168,5), baseY-j(12,5)],
        [j(65,5),  baseY-j(50,6)],
        [j(120,5), j(55,8)],
        [j(92,5),  baseY-j(55,7)],
        [j(108,5), baseY-j(48,7)],
      ];
    }

    case 'foglia': {
      // Ellisse con asse maggiore inclinato + nervatura centrale
      const rot=j(0, 0.4), rx=j(60,10), ry=j(30,6);
      return Array.from({length:16},(_,i)=>{
        if(i===14) return [cx+j(0,5), cy+j(0,5)]; // nodo centrale
        if(i===15) return [cx+j(rx*0.6,5)*Math.cos(rot), cy+j(ry*0.4,5)*Math.sin(rot)];
        const t=(i/13)*Math.PI*2;
        const x=cx+rx*Math.cos(t+rot)+j(0,4);
        const y=cy+ry*Math.sin(t+rot)*0.6+j(0,3);
        return [x,y];
      });
    }

    case 'nodo': {
      // Due cerchi intrecciati con offset variabile
      const r=j(28,6), off=j(18,5);
      return [
        ...Array.from({length:6},(_,i)=>{
          const t=(i/6)*Math.PI*2;
          return [cx-off+r*Math.cos(t)+j(0,3), cy+r*Math.sin(t)+j(0,3)];
        }),
        ...Array.from({length:6},(_,i)=>{
          const t=(i/6)*Math.PI*2;
          return [cx+off+r*Math.cos(t)+j(0,3), cy+r*Math.sin(t)+j(0,3)];
        }),
        [cx, cy-j(10,5)], [cx, cy+j(10,5)],
        [cx-off*1.8+j(5,4), cy-j(5,4)],
        [cx+off*1.8+j(5,4), cy-j(5,4)],
      ];
    }

    case 'fenice': {
      // Corpo centrale + ali asimmetriche che si espandono
      const corpoLen=j(50,8), alaS=j(40,8), alaD=j(35,8);
      const baseY=cy+j(25,6);
      return [
        [cx,          baseY],              // coda
        [cx+j(3,4),   baseY-j(15,5)],
        [cx+j(2,4),   baseY-j(30,5)],     // centro corpo
        [cx+j(2,4),   baseY-j(45,5)],
        [cx+j(3,4),   baseY-corpoLen],    // testa
        [cx+j(5,4),   baseY-j(55,5)],    // becco
        // ala sinistra (3 punte)
        [cx-j(alaS*0.5,6),  baseY-j(15,5)],
        [cx-j(alaS*0.8,6),  baseY-j(28,5)],
        [cx-j(alaS,6),      baseY-j(38,5)],
        [cx-j(alaS*0.7,6),  baseY-j(48,5)],
        // ala destra (3 punte)
        [cx+j(alaD*0.5,6),  baseY-j(18,5)],
        [cx+j(alaD*0.8,6),  baseY-j(30,5)],
        [cx+j(alaD,6),      baseY-j(42,5)],
        [cx+j(alaD*0.7,6),  baseY-j(50,5)],
        // penne coda
        [cx-j(15,5), baseY+j(10,4)],
        [cx+j(15,5), baseY+j(10,4)],
      ];
    }

    default: {
      // Fallback: punti casuali distribuiti in modo uniforme
      return Array.from({length:16},()=>[15+rng()*170, 10+rng()*100]);
    }
  }
}

// Modificatori visivi per energia prevalente del ciclo
const ENERGIA_VISUAL = {
  // densita: <1 allarga la costellazione (punti più distanti, bassa energia)
  //          >1 la comprime (punti più vicini, alta energia)
  // spessore: larghezza delle linee di connessione

/* ── Riepilogo costellazione completata ─────────────────────────────────────
   Legge le ultime 16 missioni del ciclo dallo storico esistente,
   le raggruppa per categoria e produce frasi descrittive.
   Nessun valore fisso: tutto derivato dalle missioni reali dell'utente.
────────────────────────────────────────────────────────────────────────── */
function riepilogoCiclo(idxCiclo){
  const h = storia();
  // Le missioni del ciclo sono le 16 dalla posizione (fine-1)*16 in poi nello storico.
  // Lo storico è ordinato dalla più recente, quindi le ultime 16 completate
  // per il ciclo idxCiclo sono: slice(0,16) se è l'ultimo, altrimenti più avanti.
  // Usiamo totale per calcolare l'offset corretto.
  const totale = app.totale;
  const cicloCorrente = Math.floor(totale / 16);
  const distanza = cicloCorrente - idxCiclo; // 0 = appena completato, 1 = il precedente...
  const offset = distanza * 16;
  const missioni = h.slice(offset, offset + 16).filter(e => e && e.categoria);

  if(!missioni.length) return [];

  const conta = { sociale: 0, esplorazione: 0, abitudini: 0, speciale: 0 };
  missioni.forEach(m => {
    if(m.speciale) conta.speciale++;
    else if(conta[m.categoria] !== undefined) conta[m.categoria]++;
  });

  const frasi = [];
  if(conta.esplorazione > 0)
    frasi.push(`Hai visitato o esplorato qualcosa di nuovo <strong>${conta.esplorazione} ${conta.esplorazione === 1 ? 'volta' : 'volte'}</strong>.`);
  if(conta.sociale > 0)
    frasi.push(`Hai creato occasioni di connessione con gli altri <strong>${conta.sociale} ${conta.sociale === 1 ? 'volta' : 'volte'}</strong>.`);
  if(conta.abitudini > 0)
    frasi.push(`Hai dedicato tempo a costruire abitudini <strong>${conta.abitudini} ${conta.abitudini === 1 ? 'volta' : 'volte'}</strong>.`);
  if(conta.speciale > 0)
    frasi.push(`Hai affrontato <strong>${conta.speciale}</strong> sfid${conta.speciale === 1 ? 'a' : 'e'} fuori dalla routine.`);
  return frasi;
}
function renderCostellazioneConNav(totale){
  if(totale === 0) return '';

  const progresso = totale % 16;
  // cicloAttuale: indice del ciclo che sta crescendo ora (0..15 missioni dentro)
  // Se progresso === 0 (multiplo esatto di 16), il ciclo "totale/16 - 1" è appena
  // stato chiuso e non c'è ancora un nuovo ciclo "in costruzione" finché non
  // viene completata la prossima missione.
  const cicloAttuale = Math.floor(totale / 16);
  const cInCostruzione = progresso === 0 ? null : cicloAttuale; // null = nessun ciclo aperto ora
  const ultimoCompleto = progresso === 0 ? cicloAttuale - 1 : cicloAttuale - 1;
  const haPassate = ultimoCompleto >= 0;

  if(!haPassate){
    // Nessuna costellazione completata ancora: comportamento invariato, nessun controllo
    return `<div style="margin-bottom:22px">${renderCostellazione(totale)}</div>`;
  }

  // Default: mostra l'ultima costellazione completata, oppure quella in costruzione
  // se l'utente ha navigato fin lì
  const cicloDefault  = cInCostruzione !== null ? cInCostruzione : ultimoCompleto;
  const cicloMostrato = cicloVisualizzato !== null ? cicloVisualizzato : cicloDefault;
  const isCompletaMostrata = cicloMostrato !== cInCostruzione;

  const svgHtml = isCompletaMostrata
    ? renderCostellazione(totale, cicloMostrato)
    : renderCostellazione(totale);

  const idxCostMostrata = cicloMostrato % COSTELLAZIONI.length;
  const nomeCost = COSTELLAZIONI[idxCostMostrata].nome;
  const puoIndietro = cicloMostrato > 0;
  const puoAvanti   = cicloMostrato < cicloDefault;
  const eticheta = isCompletaMostrata
    ? `Costellazione completata · ${nomeCost}`
    : 'In costruzione';

  // La celebrazione viene mostrata come popup separato (vedi checkPopupCelebrazione)
  // chiamata da renderStoria — non inline qui.

  return `<div class="costellazione-nav-wrap">
    ${svgHtml}
    <div class="costellazione-nav">
      <button class="costellazione-nav-btn" onclick="navigaCostellazione(-1)" ${puoIndietro?'':'disabled'} aria-label="Costellazione precedente">‹</button>
      <span class="costellazione-nav-label">${eticheta}</span>
      <button class="costellazione-nav-btn" onclick="navigaCostellazione(1)" ${puoAvanti?'':'disabled'} aria-label="Costellazione successiva">›</button>
    </div>
  </div>`;
}

function renderCostellazione(totale, cicloOverride){
  if(totale === 0 && cicloOverride === undefined) return '';

  // cicloOverride: se fornito, mostra quella costellazione specifica
  // (sempre completa, 16/16) invece di quella in corso. Usato per
  // rivedere le costellazioni già chiuse dall'archivio.
  const cicloCorrente = Math.floor(totale / 16);
  const ciclo     = cicloOverride !== undefined ? cicloOverride : cicloCorrente;
  const progresso = ciclo === cicloCorrente ? (totale % 16) : 16;
  const idxCost   = ciclo % COSTELLAZIONI.length;
  const cost      = COSTELLAZIONI[idxCost];
  const isCompleta= cicloOverride !== undefined || (progresso === 0 && ciclo > 0 && ciclo === cicloCorrente) || ciclo < cicloCorrente;
  const attive    = isCompleta ? 16 : progresso;

  // Firma persistente: seed stabile + energia prevalente del ciclo
  const firma   = getFirmaCiclo(ciclo);
  const seed    = firma.seed;
  const visual  = ENERGIA_VISUAL[firma.energia] || ENERGIA_VISUAL.media;

  // Il seed genera deformazioni deterministiche e stabili nel tempo:
  // shift dei nodi, leggera rotazione, variazione di densità.
  const rngFirma   = mkRng(Math.floor(seed * 1e9));
  const rotazione  = (rngFirma() - .5) * 14;              // -7°..+7°
  const shiftScale = .04 + rngFirma() * .05;               // intensità shift nodi
  const denseFactor= .92 + rngFirma() * .16;                // .92..1.08 densità

  const W = 200, H = 120;
  const cxView = W/2, cyView = H/2;
  const rad = rotazione * Math.PI / 180;

  // Deforma un nodo: shift deterministico (seedato sull'indice) + rotazione + densità
  // La densità combina due fattori indipendenti:
  // - denseFactor (dal seed, varia la forma in modo univoco e stabile)
  // - visual.densita (dall'energia: low=più distanti, high=più compatte)
  // Genera stelle proceduralmente dal seed del ciclo
  // Il seed determina sia la forma specifica (coordinate) sia le deformazioni
  const rngGeom = mkRng(Math.floor(seed * 1e9));
  // Usiamo rotazione e densità dell'energia come modificatori visivi,
  // ma la posizione base è interamente generata dal seed
  const nodiBase = generaStelle(cost.topologia, rngGeom);

  // Applica rotazione globale (seed-based) e scaling densità (energia-based)
  const nodiTrasformati = nodiBase.map(([x,y]) => {
    // Densità: avvicina/allontana dal centro (effetto energia)
    const fx = cxView + (x - cxView) * visual.densita;
    const fy = cyView + (y - cyView) * visual.densita;
    // Rotazione globale leggera (seed-based, ±7°)
    const rx = cxView + (fx - cxView) * Math.cos(rad) - (fy - cyView) * Math.sin(rad);
    const ry = cyView + (fx - cxView) * Math.sin(rad) + (fy - cyView) * Math.cos(rad);
    return [rx, ry];
  });

  // Solo linee tra stelle già attive — non rivela la forma futura
  const linee = cost.linee
    .filter(([a,b]) => a < attive && b < attive)
    .map(([a,b]) => {
      const [xa,ya] = nodiTrasformati[a];
      const [xb,yb] = nodiTrasformati[b];
      // La linea compare dopo che entrambe le stelle che connette sono apparse
      const delayLinea = (Math.max(a,b) * 0.09 + 0.25).toFixed(2);
      const opTarget    = (.28*visual.glow).toFixed(2);
      return `<line x1="${xa.toFixed(1)}" y1="${ya.toFixed(1)}" x2="${xb.toFixed(1)}" y2="${yb.toFixed(1)}" class="linea-cost-attiva" style="--linea-op:${opTarget};animation-delay:${delayLinea}s;stroke-width:${visual.spessore}"/>`;
    }).join('');

  // Solo stelle attive — quelle future non esistono visivamente
  // Recupera le missioni del ciclo corrente dallo storico esistente.
  // Lo storico è ordinato dal più recente, quindi le 16 missioni del ciclo
  // 'ciclo' partono dall'offset (cicloCorrente - ciclo) * 16.
  const hTutte = storia();
  const offsetCiclo = (cicloCorrente - ciclo) * 16;
  const missioniCiclo = hTutte.slice(offsetCiclo, offsetCiclo + 16);
  // Mappa energia → raggio (px) — ogni stella è indipendente dalle altre
  const RAGGIO_PER_ENERGIA = { bassa: 2.2, media: 3.6, alta: 5.0 };
  const GLOW_PER_ENERGIA   = { bassa: 2.5, media: 4.0, alta: 7.0 };

  const stelleSVG = nodiTrasformati
    .map(([cx,cy], i) => {
      if(i >= attive) return ''; // stelle future non visibili
      const isUltima = i === attive - 1 && !isCompleta;
      const cls = isUltima ? 'stella-recente' : 'stella-attiva';
      // Energia della missione che ha generato questa stella.
      // Lo storico è dal più recente: la stella più recente (i=0) è missioniCiclo[0].
      // Le stelle compaiono in ordine inverso allo storico, quindi:
      // stella i → missioniCiclo[attive - 1 - i] (la prima stella completata è la più vecchia)
      const missioneStella = missioniCiclo[attive - 1 - i];
      const energiaStella  = (missioneStella && missioneStella.energia) || 'media';
      const r       = (RAGGIO_PER_ENERGIA[energiaStella] * (isUltima ? 1.05 : 1)).toFixed(2);
      const glowPx  = GLOW_PER_ENERGIA[energiaStella].toFixed(1);
      // Opacità glow proporzionale all'energia per rafforzare la differenza percepita
      const glowOp  = energiaStella === 'alta' ? '.65' : energiaStella === 'media' ? '.5' : '.35';
      const delay   = (i * 0.14).toFixed(2);
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" class="${cls}" style="animation-delay:${delay}s;filter:drop-shadow(0 0 ${glowPx}px rgba(201,168,76,${glowOp}))"/>`;
    }).join('');

  const frase = FRASI_COST[cost.frasi_idx];

  return `<div class="costellazione-wrap">
    <svg class="costellazione-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" >
      ${linee}${stelleSVG}
    </svg>
    <div class="costellazione-label">${frase}</div>
  </div>`;
}

/* ── Popup celebrazione costellazione completata ─────────────────────────
   Mostrato UNA SOLA VOLTA la prima volta che si apre l'archivio dopo
   aver completato una costellazione. Flag 'celebrazioneMostrata' nella firma.
────────────────────────────────────────────────────────────────────────── */
function checkPopupCelebrazione(){
  const totale = app.totale;
  if(totale < 16) return; // nessuna costellazione ancora completata

  const progresso = totale % 16;
  const cicloCorrente = Math.floor(totale / 16);

  // Cerca il ciclo più recente con celebrazione non ancora mostrata
  // Può essere il ciclo appena chiuso (progresso > 0 → cicloCorrente-1)
  // oppure il ciclo corrente se progresso === 0 (multiplo esatto di 16)
  let cicloCompletato = null;
  if(progresso === 0 && cicloCorrente > 0){
    // Appena completato il ciclo cicloCorrente - 1
    const c = cicloCorrente - 1;
    const firma = getFirmaCiclo(c);
    if(!firma.celebrazioneMostrata) cicloCompletato = c;
  } else if(cicloCorrente > 0){
    // Controlla se il ciclo precedente non è stato ancora celebrato
    const c = cicloCorrente - 1;
    const firma = getFirmaCiclo(c);
    if(!firma.celebrazioneMostrata) cicloCompletato = c;
  }

  if(cicloCompletato === null) return;

  // Segna subito come mostrata, poi costruisce e inietta il popup
  marcaCelebrazioneMostrata(cicloCompletato);

  const idxCost = cicloCompletato % COSTELLAZIONI.length;
  const nomeCost = COSTELLAZIONI[idxCost].nome;
  const righe = riepilogoCiclo(cicloCompletato);
  const righeHtml = righe.map(r => `<li class="celebrazione-riga">${r}</li>`).join('');

  // SVG della costellazione completata (tutte 16 stelle, via renderCostellazione)
  const svgHtml = renderCostellazione(totale, cicloCompletato);

  const popup = document.createElement('div');
  popup.id = 'popup-celebrazione';
  popup.className = 'popup-overlay';
  popup.innerHTML = `
    <div class="popup-box">
      <div class="popup-header">
        <span class="celebrazione-stella">✦</span>
        <div class="celebrazione-testo">Costellazione completata</div>
        <div class="celebrazione-nome">${nomeCost}</div>
      </div>
      ${righeHtml ? `<div class="celebrazione-riepilogo-wrap">
        <ul class="celebrazione-riepilogo">${righeHtml}
          <li class="celebrazione-riga celebrazione-riga-altro">&hellip;e molto altro.</li>
        </ul>
      </div>` : ''}
      <div class="popup-cost">${svgHtml}</div>
      <button class="btn btn-popup-cta btn-full" onclick="chiudiPopup()">
        Continua il viaggio
      </button>
    </div>`;
  document.body.appendChild(popup);
  // Forza reflow prima di aggiungere la classe animate
  popup.offsetHeight;
  popup.classList.add('visible');
}

window.chiudiPopup = function(){
  const p = document.getElementById('popup-celebrazione');
  if(p){ p.classList.remove('visible'); setTimeout(()=>p.remove(), 350); }
};

function renderDettaglioMissione(e, idxGlobale, fu){

  if(fu && fu.stato === 'non_ancora')
    return `<p class="followup-esito">Nessun seguito, per ora. Pu\u00f2 succedere col tempo.</p>`;
  if(fu && fu.stato === 'difficile')
    return `<p class="followup-esito">Non \u00e8 chiaro se ne sia nato un seguito.</p>`;
  if(runtimeStep === 'prompt')
    return `<div class="followup-prompt">
      <p class="followup-question">\u00c8 successo qualcosa grazie a questa azione?</p>
      <div class="followup-options">
        <button onclick="rispondiFollowUp(${idxGlobale},'si',event)">S\u00ec</button>
        <button onclick="rispondiFollowUp(${idxGlobale},'non_ancora',event)">Non ancora</button>
        <button onclick="rispondiFollowUp(${idxGlobale},'difficile',event)">Difficile dirlo</button>
      </div></div>`;
  if(runtimeStep === 'nota')
    return `<div class="followup-prompt">
      <p class="followup-question">Raccontalo in poche parole, se vuoi.</p>
      <textarea id="fu-nota-${idxGlobale}" class="followup-textarea" placeholder="\u00c8 successo che\u2026" rows="2" onclick="event.stopPropagation()"></textarea>
      <button class="followup-save" onclick="salvaNotaFollowUp(${idxGlobale},event)">Salva</button></div>`;
  return `<button class="followup-link" onclick="apriFollowUp(${idxGlobale},event)">aggiungi un seguito</button>`;
}

window.selezionaSlide = function(id){
  // Aggiorna il pannello espanso senza re-render completo dello slider
  const wasOpen = cicloEspanso === id;
  cicloEspanso = wasOpen ? null : id;

  // Aggiorna dots

  });

  // Aggiorna active sullo slide
  document.querySelectorAll('.cost-slide').forEach(s => s.classList.remove('active'));
  const clicked = event && event.currentTarget;
  if(clicked && !wasOpen) clicked.classList.add('active');

  // Renderizza il pannello espanso
  const panel = document.getElementById('cost-espanso');

    const c = id;
    const baseOffset = progresso > 0 ? progresso : 0;
    const startIdx = baseOffset + (cicloCorrente - 1 - c) * 16;
    missioni = h.slice(startIdx, startIdx + 16);
    const idxCost = c % COSTELLAZIONI.length;
    nomeHtml = `<span class="cost-card-nome" style="font-size:17px">${COSTELLAZIONI[idxCost].nome}</span>`;
  }

  const fu_all = getFollowUps();
  const baseIdx = id === 'corrente' ? 0 : (() => {
    const baseOffset = progresso > 0 ? progresso : 0;
    return baseOffset + (cicloCorrente - 1 - id) * 16;
  })();

  missioniHtml = missioni.map((e,i) => {
    const idxGlobale = baseIdx + i;
    const fu = fu_all[idxGlobale];
    const det = renderDettaglioMissione(e, idxGlobale, fu);
    const espCls = storiaVoceEspansa === idxGlobale ? ' expanded' : '';
    return `<div class="history-item${espCls}" onclick="toggleStoriaItem(this)">
      <div class="history-row">
        <span class="history-icon">${EN_EMOJI[e.energia]||'&middot;'}</span>
        <div style="flex:1;min-width:0">
          <div class="history-title">${azioneAlPassato(e.missioneId, e.titolo)}</div>
          <div class="history-meta">${new Date(e.completatoIl).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</div>
        </div>
        <div class="history-check"><svg fill="none" viewBox="0 0 24 24" stroke="var(--teal)" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>
      </div>
      <div class="history-detail">${det}</div>
    </div>`;
  }).join('');

  panel.innerHTML = `<div class="cost-espanso-detail">
    <div class="cost-espanso-header">
      ${nomeHtml}
      <button class="cost-espanso-close" onclick="selezionaSlide(${JSON.stringify(id)})">&#10005;</button>
    </div>
    <div style="padding:10px 14px 14px">${missioniHtml}</div>
  </div>`;
};
