window.navigaCostellazione = function(direzione){
  const cicloCorrente = Math.floor(app.totale / 16);
  let attuale = cicloVisualizzato !== null ? cicloVisualizzato : cicloCorrente;
  let nuovo = attuale + direzione;
  if(nuovo < 0) nuovo = 0;
  if(nuovo > cicloCorrente) nuovo = cicloCorrente;
  cicloVisualizzato = (nuovo === cicloCorrente) ? null : nuovo;
  renderStoriaInPlace();
};

function renderStoriaInPlace(){
  const main = document.getElementById('main');
  if(main){
    main.innerHTML = renderStoria();
    initSliderDots();
  }
}

function initSliderDots(){
  const slider = document.getElementById('cost-slider');
  const dots   = document.querySelectorAll('.cost-dot');
  if(!slider || !dots.length) return;
  slider.addEventListener('scroll', function(){
    const slides = slider.querySelectorAll('.cost-slide');
    let activeIdx = 0;
    slides.forEach((s,i) => {
      if(s.getBoundingClientRect().left <= slider.getBoundingClientRect().left + 10) activeIdx = i;
    });
    dots.forEach((d,i) => d.classList.toggle('active', i === activeIdx));
  }, {passive:true});
}


/* ── Firma persistente costellazioni ──────────────────────────────────────
   Ogni ciclo di 16 missioni ottiene un seed stabile, salvato una sola volta.
   Il seed deforma in modo deterministico la geometria base della forma,
   così ogni costellazione è unica ma identica ad ogni reload.
   Struttura: { "<idxCiclo>": { seed: 0.482, energia: "media" } }
────────────────────────────────────────────────────────────────────────── */
const KC = { FIRME: 'll_cost_firme' };

function getFirmeCostellazioni(){ try{return JSON.parse(localStorage.getItem(KC.FIRME))||{};}catch{return{};} }
function saveFirmeCostellazioni(v){ try{localStorage.setItem(KC.FIRME,JSON.stringify(v));}catch{} }

// Energia prevalente nelle ultime N missioni completate (storico già esistente)
function energiaPrevalente(n){
  const h = storia().slice(0, n);
  if(!h.length) return 'media';
  const conta = {bassa:0, media:0, alta:0};
  h.forEach(e => { if(conta[e.energia]!==undefined) conta[e.energia]++; });
  return Object.entries(conta).sort((a,b)=>b[1]-a[1])[0][0];
}

// Ottiene (o crea) la firma persistente per un dato ciclo di costellazione
function getFirmaCiclo(idxCiclo){
  const firme = getFirmeCostellazioni();
  if(firme[idxCiclo]) return firme[idxCiclo];

  // Prima volta che vediamo questo ciclo: genera seed deterministico
  // basato su data di creazione + indice ciclo, poi lo persiste.
  const seedBase = rngVal(oggi(), 'costellazione' + idxCiclo);
  const firma = {
    seed: seedBase,
    energia: energiaPrevalente(16),
    celebrazioneMostrata: false,
  };
  firme[idxCiclo] = firma;
  saveFirmeCostellazioni(firme);
  return firma;
}

// Segna una costellazione come "vista completa" (per non ripetere la celebrazione)
function marcaCelebrazioneMostrata(idxCiclo){
  const firme = getFirmeCostellazioni();
  if(firme[idxCiclo] && !firme[idxCiclo].celebrazioneMostrata){
    firme[idxCiclo].celebrazioneMostrata = true;
    saveFirmeCostellazioni(firme);
    return true; // era la prima volta
  }
  return false;
}

/* ── Selezione rituale del giorno (deterministica) ── */
function scegliRituale(data){
  const r = mkRng(hash(data+'rit2'));r();
  return RITUALI[Math.min(Math.floor(r()*RITUALI.length),RITUALI.length-1)];
}

/* ── Stato runtime rituale ── */
let ritRuntime = { fase:'selezione', rituale:null, testo:'', animTimer:null };

function resetRitRuntime(data){
  if(ritRuntime.animTimer) clearTimeout(ritRuntime.animTimer);
  ritRuntime = { fase:'selezione', rituale:scegliRituale(data), testo:'', animTimer:null };
}

/* ── Avvia il rituale ── */
window.avviaRituale = function(){
  const ta = document.getElementById('rit-ta');
  if(ta) ritRuntime.testo = ta.value;

  if(!ritRuntime.testo.trim()) return;

  const testo = ritRuntime.testo.trim();
  ritRuntime.testo = testo;
  ritRuntime.fase = 'animazione';

  const el = document.getElementById('rituale-content');
  if(!el) return;

  // Inietta il contenuto animato
  el.innerHTML = buildAnimazione(ritRuntime.rituale, testo);

  // Forza reflow per assicurare che le animazioni CSS partano
  el.offsetHeight;

  // Timer completamento
  if(ritRuntime.animTimer) clearTimeout(ritRuntime.animTimer);
  ritRuntime.animTimer = setTimeout(()=>{
    ritRuntime.fase = 'completato';
    saveRitStato({ data:oggi(), completato:true });
    incRituali();
    addPF();
    const pfEl = document.getElementById('pf-count');
    if(pfEl) pfEl.textContent = getPF();
    if(el) el.innerHTML = `<div class="rituale-done">
      <div class="rituale-done-icon">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#0D1117" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <div>
        <strong>Rituale completato</strong>
        <span>Il pensiero ha trovato la sua forma.</span>
      </div>
    </div>`;
  }, ritRuntime.rituale.durata);
};

/* ── onRitTesto: aggiorna testo runtime dalla textarea ── */
window.onRitTesto = function(el){ ritRuntime.testo = el.value; };

/* ── renderRitualeBox: usato solo per reset/init ── */
function renderRitualeBox(){
  const el = document.getElementById('rituale-content');
  if(!el) return;
  el.innerHTML = buildRitualeContent();
  const ta = document.getElementById('rit-ta');
  if(ta){
    ta.value = ritRuntime.testo || '';
    ta.addEventListener('input', function(){ ritRuntime.testo = this.value; });
  }
}


function buildRitualeContent(){
  const {fase, rituale, testo} = ritRuntime;
  if(!rituale) return '';

  if(fase === 'completato'){
    return `<div class="rituale-done">
      <div class="rituale-done-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#0D1117" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>
      <div><strong>Rituale completato</strong><span>Il pensiero ha trovato la sua forma.</span></div>
    </div>`;
  }

  if(fase === 'animazione'){
    return buildAnimazione(rituale, testo);
  }

  // fase === 'scrittura' (default)
  return `<div>
    <p style="font-size:12px;color:var(--cream-dim);margin-bottom:10px;font-style:italic">${rituale.hint}</p>
    <textarea id="rit-ta" class="rituale-textarea"
              placeholder="${rituale.placeholder}"
              oninput="onRitTesto(this)"
              maxlength="200" rows="3"></textarea>
    <button class="btn btn-rituale btn-full" onclick="avviaRituale()" style="margin-top:10px">
      Esegui il rituale →
    </button>
  </div>`;
}


function buildAnimazione(rit, testo){
  const escaped = testo.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const d = rit.durata;

  if(rit.id === 'fuoco'){
    return `<div class="rituale-stage">
      <div class="rituale-stage-text" style="animation:fuoco ${d}ms ease-in forwards">${escaped}</div>
    </div>`;
  }

  if(rit.id === 'acqua'){
    return `<div class="rituale-stage" style="background:linear-gradient(180deg,#0D1117 0%,#0D2030 100%)">
      <div style="position:absolute;bottom:0;left:0;right:0;height:40%;
                  background:rgba(78,205,196,.06);animation:ondaMove 3s ease-in-out infinite;
                  border-radius:50% 50% 0 0"></div>
      <div class="rituale-stage-text" style="animation:scorri ${d}ms ease-in forwards">${escaped}</div>
    </div>`;
  }

  if(rit.id === 'vento'){
    // CSS custom properties su elemento wrapping — compatibile con tutti i browser
    const foglie = [
      {tx:'-80px',ty:'-60px',rot:'120deg', delay:'0ms'},
      {tx:'90px', ty:'-70px',rot:'-90deg', delay:'200ms'},
      {tx:'-60px',ty:'80px', rot:'200deg', delay:'100ms'},
      {tx:'70px', ty:'75px', rot:'-150deg',delay:'300ms'},
      {tx:'-30px',ty:'-90px',rot:'60deg',  delay:'150ms'},
    ];
    const foglieSVG = foglie.map(f=>`
      <svg style="position:absolute;width:20px;height:24px;
                  animation:foglia-vola ${d}ms ${f.delay} ease-out forwards;
                  transform-origin:center;
                  --fx:${f.tx};--fy:${f.ty};--fr:${f.rot}"
           viewBox="0 0 18 22">
        <path d="M9 20 C9 20 2 14 2 8 C2 4 5 1 9 1 C13 1 16 4 16 8 C16 14 9 20 9 20Z"
              fill="rgba(78,205,196,.5)" stroke="rgba(78,205,196,.8)" stroke-width="1"/>
      </svg>`).join('');
    return `<div class="rituale-stage" style="position:relative">
      <div class="rituale-stage-text" style="animation:fuoco ${d}ms ease-in forwards">${escaped}</div>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
        ${foglieSVG}
      </div>
    </div>`;
  }

  if(rit.id === 'pagina'){
    return `<div class="rituale-stage" style="perspective:600px">
      <div class="rituale-stage-text"
           style="animation:paginaGira ${d}ms ease-in-out forwards;
                  background:rgba(255,255,255,.03);border-radius:8px;
                  padding:16px;border:1px solid rgba(255,255,255,.08)">
        ${escaped}
      </div>
    </div>`;
  }

  if(rit.id === 'seme'){
    const d2 = Math.round(d*0.7);
    const d3 = Math.round(d*0.2);
    const d4 = Math.round(d*0.35);
    return `<div class="rituale-stage" style="flex-direction:column;gap:12px">
      <div class="rituale-stage-text" style="font-size:13px;opacity:.75">${escaped}</div>
      <svg viewBox="0 0 80 65" style="width:90px;height:65px;overflow:visible">
        <line x1="40" y1="63" x2="40" y2="30"
              stroke="var(--teal)" stroke-width="2" stroke-linecap="round"
              stroke-dasharray="35" stroke-dashoffset="35"
              style="animation:germoglia ${d}ms ease-out forwards"/>
        <path d="M40 35 C40 35 27 28 25 15 C30 10 39 18 40 35Z"
              fill="rgba(78,205,196,.4)" stroke="var(--teal)" stroke-width="1"
              stroke-dasharray="70" stroke-dashoffset="70"
              style="animation:germoglia ${d2}ms ${d3}ms ease-out forwards"/>
        <path d="M40 28 C40 28 53 21 55 8 C50 3 41 11 40 28Z"
              fill="rgba(78,205,196,.3)" stroke="var(--teal)" stroke-width="1"
              stroke-dasharray="70" stroke-dashoffset="70"
              style="animation:germoglia ${d2}ms ${d4}ms ease-out forwards"/>
      </svg>
    </div>`;
  }

  return `<div class="rituale-stage"><div class="rituale-stage-text">${escaped}</div></div>`;
}


/* ── Render card rituale (chiamata da renderHome) ── */
function renderCardRituale(statoOggi){
  const data  = oggi();
  const rit   = scegliRituale(data);
  const fatto = statoOggi?.completato;

  // Init runtime se non ancora fatto per oggi
  if(ritRuntime.rituale?.id !== rit.id) resetRitRuntime(data);

  const contenuto = fatto
    ? `<div class="rituale-done">
        <div class="rituale-done-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#0D1117" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>
        <div><strong>Rituale completato</strong><span>Il pensiero ha trovato la sua forma.</span></div>
      </div>`
    : `<div id="rituale-content">${buildRitualeContent()}</div>`;

  return `<div class="card-rituale-light" style="animation:fadeUp .45s .35s var(--ease-spring) both">
    <div class="card-header">
      <span class="tag-rituale">✦ Rituale del giorno</span>
      <span style="font-size:18px">${rit.emoji}</span>
    </div>
    <div style="font-family:'Playfair Display',serif;font-size:20px;margin:10px 0 6px;line-height:1.25">${rit.nome}</div>
    <div style="font-size:13px;color:var(--cream-dim);line-height:1.6;margin-bottom:14px">Un gesto simbolico. Nessuna promessa, solo un momento tuo.</div>
    ${contenuto}
  </div>`;
}
